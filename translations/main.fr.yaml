      title_html: "Le meilleur de la technologie événementielle<br>et de l’humain <span>au service de vos événements</span>"
      lead_html: "Associez la puissance de l’IA aux meilleurs experts du secteur pour offrir à vos participants une expérience événementielle fluide, efficace et incomparable."
      buttons:
        "0": "Réservation tout-en-un"
        "1": "Économies automatisées"
        "2": "Événementiel engagé"
        "3": "Direct ou accompagné"
