            p_top_html: "Accédez à plus de <span class=\"bold\">19&nbsp;000 lieux</span>, prestataires de service, activités de team building et restaurants vérifiés en France."
            blocks:
              "0":
                h4_html: "Simplifiez votre réservation en ligne"
                p_html: "Comparez les offres en quelques clics, sélectionnez les solutions adaptées à vos besoins et réservez directement en ligne."
              "1":
                h4_html: "Transparence et meilleurs tarifs garantis"
                p_html: "Devis fournisseurs d’origine, aucun coût caché, aucune marge."
        "1":
          left:
            card_title_html: "Analyse des<br>dépenses"
          right:
            h3_html: "Des économies générées automatiquement"
            p_top_html: "En plus de proposer les meilleurs tarifs du marché grâce à nos contrats négociés avec chaque prestataire événementiel."
            blocks:
              "0":
                h4_html: "Optimisation des devis"
                p_html: "Notre moteur IA stimule la concurrence entre prestataires et identifie les opportunités de réduction sans compromis sur la qualité. Chaque devis est vérifié et optimisé par nos chefs de projet événementiels."
              "1":
                h4_html: "De 10 % à 30 % d’économies"
        "2":
          left:
            card_title_html: "Emission carbone"
          right:
            h3_html: "Performance & Responsabilité : l’événementiel engagé"
            blocks:
              "0":
                h4_html: "Evaluez les prestataires selon des indications RSE"
                p_html: "Comparez les prestataires sur la base d’indicateurs RSE fiables en matière d’impact environnemental, social et éthique."
              "1":
                h4_html: "Maîtrisez l’impact carbone de chaque événement"
                p_html: "Simulez l’empreinte carbone de chaque événement pour guider vos décisions vers un impact maîtrisé et mesurable."
        "3":
          right:
            h3_html: "En autonomie ou accompagné,<br>vous décidez de notre degré d’implication !"
            blocks:
              "0":
                h4_html: "En direct :"
                p_html: "Vous gardez la main sur chaque étape de votre projet. Vous recherchez, comparez et réservez directement vos prestataires en ligne. En quelques clics, votre séminaire prend forme, avec la garantie des meilleurs tarifs sans frais cachés."
              "1":
                h4_html: "Avec l’accompagnement d’un chef de projet dédié :"
                p_html: "Vous profitez de l’expertise d’un professionnel événementiel qui affine vos recherches, valide et négocie les devis à votre place. Vous gagnez du temps, tout en sécurisant vos choix aux meilleures conditions."
