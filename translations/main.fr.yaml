      title_html: "Des événements <span>pensés pour vous</span> et vos équipes"
      cards:
        "0":
          label: "Séminaire résidentiel"
        "1":
          label: "Journée d’étude"
        "2":
          label: "Team building"
        "3":
          label: "Comme à la maison"
        "4":
          label: "Soirée d’entreprise"
    bloc3:
      items:
        "0":
          title: "Claire"
          subtitle: "BNP PARIBAS"
          text: "La plateforme est intuitive et les résultats sont toujours en adéquation avec nos besoins. J’ai particulièrement apprécié la fonction de panier et la possibilité de comparer plusieurs lieux avant de faire mon choix. En quelques clics, nous avons trouvé le lieu parfait pour notre journée d’étude."
        "1":
          title: "Jacqueline"
          subtitle: "TotalEnergies"
          text: "Réactivité. Dans un CODIR, les dates peuvent souvent changer. Business Profiler sait se mettre à l'écoute de nos besoins."
        "2":
          title: "Sophie"
          subtitle: "ENGIE Solutions"
          text: "Nous utilisons Business Profilers depuis plusieurs mois pour organiser nos séminaires d’entreprise, et c’est un vrai gain de temps. La plateforme est claire, les filtres sont précis et les fiches lieux très complètes."
        "3":
          title: "Thomas"
          subtitle: "Institut Pasteur"
          text: "Ce qui fait la différence avec Business Profilers, c’est la combinaison entre un outil digital performant et un accompagnement sur mesure. Après avoir rempli notre brief, nous avons rapidement reçu une sélection pertinente de lieux adaptés à notre budget et à notre format de séminaire."
        "4":
          title: "Cécile"
          subtitle: "EDF"
          text: "Un immense merci, Julie ! Votre professionnalisme, votre sens du détail et votre engagement font toute la différence. Grâce à vous, mes événements ont une saveur toute particulière. C’est un vrai plaisir de collaborer avec vous."
        "5":
          title: "Valérie"
          subtitle: "APEC"
          text: "Toujours d'excellentes relations avec Carole qui facilitent l'organisation de mes événements : écoute, bonne humeur sont des qualités que j'apprécie particulièrement."
        "6":
          title: "Laura"
          subtitle: "L'OREAL"
          text: "En quelques minutes, j’ai trouvé plusieurs lieux adaptés à notre budget. L’interface est intuitive et les réponses rapides. Je recommande !"
        "7":
          title: "Julien"
          subtitle: "THALES"
          text: "Nous passons par Business Profilers pour tous nos séminaires et formations internes. Les établissements proposés sont toujours de grande qualité, et le suivi est impeccable. Ce n’est pas seulement une plateforme, c’est un vrai partenaire qui comprend les enjeux des entreprises."
        "8":
          title: "Marc"
          subtitle: "AIRBUS"
          text: "La plateforme est claire, les lieux sont variés et de qualité. Le service client est top, toujours disponible pour ajuster notre brief."
        "9":
          title: "Tassadite"
          subtitle: "ALSTOM"
          text: "Maike est d'une efficacité redoutable, à l'écoute. Elle a su très vite identifier nos besoins et satisfaire nos attentes avec \"les moyens du bord\" merci également de sa patience. Elle a su nous faire confiance."
    bloc4:
      title_html: "<span>Votre copilote</span> du début à la fin !"
      paragraph_html: "Rejoignez plus de 100 000 organisateurs qui nous confient la gestion de leurs événements. Du brief à la réservation, on vous accompagne à chaque étape pour trouver les meilleurs lieux, activités, restaurants et prestataires."
