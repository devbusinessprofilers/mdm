      qualifications_title: "Qualifications"
      qualifications:
        item1: "Vous avez des prédisposions à l’action commerciale et vous aimez vous investir pour satisfaire vos clients."
        item2: "Vous justifiez d’une 1<sup>ère</sup> expérience réussie en vente, la connaissance du tourisme d’affaires est un plus."
        item3: "Vous savez gérer les priorités, les urgences et les outils bureautiques n’ont pas de secret pour vous."
