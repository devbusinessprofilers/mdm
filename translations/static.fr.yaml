  cookies:
    body_intro: |
      <p>Ce site utilise des cookies afin d’améliorer votre expérience et optimiser nos sites et services.</p>
      <p>Les cookies sont de petites quantités d’informations stockées dans des fichiers au sein même du navigateur de votre ordinateur. Les cookies sont accessibles et enregistrés par les sites internet que vous consultez, et par les sociétés qui affichent leurs annonces publicitaires sur des sites internet, pour qu’ils puissent reconnaître le navigateur. Les sites Internet peuvent uniquement accéder aux cookies qu’ils ont stockés sur votre ordinateur.</p>
      <p>En utilisant le Site Internet, vous consentez à l’utilisation des cookies déposés par notre Site.</p>
      <p>Le site Internet utilise des cookies aux fins suivantes :</p>
      <ul>
        <li><u>Usage du site</u> : pour nous aider à reconnaître votre navigateur comme celui d’un visiteur précédent et pour enregistrer les préférences que vous avez déterminées lors de votre précédente visite sur le Site. Par exemple, nous pouvons enregistrer vos informations de connexion de sorte que vous n’ayez pas à vous connecter à chaque fois que vous visitez le Site ;</li>
        <li><u>Réseaux sociaux</u> : pour vérifier si vous êtes connectés à des services tiers (Linkedin, Instagram, Twitter, …)</li>
        <li><u>Ciblage </u>: pour nous permettre de cibler (emailing, enrichissement de base) à postériori ou en temps réel l’internaute qui navigue sur notre Site ;</li>
        <li><u>Mesure d’audience</u> : pour suivre les données statistiques de fréquentation du Site (soit l’utilisation faite du Site par les utilisateurs et pour améliorer les services du Site) et pour nous aider à mesurer et étudier l’efficacité de notre contenu interactif en ligne, de ses caractéristiques, publicités et autres communications.</li>
      </ul>
      <p>Vous trouverez ci-dessous les explications de notre utilisation des cookies sur nos sites Web et la raison pour laquelle nous les utilisons.</p>
    table: |
      <figure class="table">
        <table>
          <tbody>
            <tr>
              <td><h6><strong>Cookie</strong></h6></td>
              <td><h6><strong>Détails</strong></h6></td>
              <td><h6><strong>Nom et échéance</strong></h6></td>
            </tr>
            <tr>
              <td>Google Analytics</td>
              <td>Cookies de Google Analytics – Nous utilisons ces cookies pour recueillir des informations sur la façon dont les visiteurs utilisent nos sites web, y compris les détails du site que le visiteur a parcouru avant d’arriver sur notre site, et le nombre total de fois qu’un visiteur a visité notre site. Nous utilisons les informations pour optimiser nos sites web et nos services, et pour améliorer l’expérience de nos utilisateurs. Les cookies ne vous identifient pas personnellement. Ils se contentent de collecter de façon anonyme des informations qui sont transmises et stockées par Google sur des serveurs aux États-Unis conformément à ses pratiques de confidentialité. Pour en savoir plus sur les pratiques de confidentialité de Google Analytics, cliquez sur : https://support.google.com/analytics/answer/6004245</td>
              <td>
                <p>__utma = 2 ans</p>
                <p>__utmb = 30 minutes</p>
                <p>__utmc = Fin de la session de navigateur</p>
                <p>__utmz = 6 mois</p>
                <p>__utmv = 2 ans</p>
              </td>
            </tr>
            <tr>
              <td>Sendinblue</td>
              <td>Avec Sendinblue, nous analysons ce que vous visitez et comment vous visitez notre page Web.&nbsp;</td>
              <td>Pour plus d’informations sur les cookies avec différentes dates d’expiration, veuillez consulter la politique de confidentialité de Sendinblue pour obtenir plus de détails.</td>
            </tr>
            <tr>
              <td>LinkedIn</td>
              <td>Nous utilisons la fonction Tag-insight de LinkedIn pour mesurer la performance de nos annonces LinkedIn. Pour en savoir plus, visitez https://www.linkedin.com/legal/cookie-table</td>
              <td>Pour d’avantage d’informations sur les cookies avec différentes dates d’expiration, veuillez consulter la politique de confidentialité de LinkedIn pour obtenir plus de détails.</td>
            </tr>
          </tbody>
        </table>
      </figure>
    choices:
      title: "Vos choix concernant les cookies et balises web"
      body: |
        <p>Vous avez le choix de configurer votre navigateur pour accepter tous les cookies, rejeter tous les cookies, vous informer quand un cookie est émis, sa durée de validité et son contenu, ainsi que vous permettre de refuser son enregistrement dans votre terminal, et supprimer vos cookies périodiquement.</p>
        <p>Vous pouvez paramétrer votre navigateur Internet pour désactiver les cookies. Notez toutefois que si vous désactivez les cookies, votre nom d’utilisateur ainsi que votre mot de passe ne seront plus sauvegardés sur aucun site web. Pour plus d’informations relatives aux méthodes vous permettant de supprimer et de contrôler les cookies stockés sur votre ordinateur, consultez le site suivant : <a target="_self" href="http://www.allaboutcookies.org/fr">http://www.allaboutcookies.org/fr</a></p>
        <p>Cliquez <a href="javascript:openAxeptioCookies()" target="_self">ici</a> pour modifier vos préférences en matière de cookies</p>
    browser:
      title: "Comment configurer votre navigateur"
      body: |
        <ul><li><strong>Firefox </strong>:</li></ul>
        <ol>
          <li>Ouvrez Firefox</li>
          <li>Appuyez sur la touche « Alt »</li>
          <li>Dans le menu en haut de la page cliquez sur « Outils » puis « Options »</li>
          <li>Sélectionnez l’onglet « Vie privée »</li>
          <li>Dans le menu déroulant à droite de « Règles de conservation », cliquez sur « utiliser les paramètres personnalisés pour l’historique »</li>
          <li>Un peu plus bas, décochez « Accepter les cookies »</li>
          <li>Sauvegardez vos préférences en cliquant sur « OK »</li>
        </ol>
        <ul><li><strong>Internet Explorer</strong> :</li></ul>
        <ol>
          <li>Ouvrez Internet Explorer</li>
          <li>Dans le menu « Outils », sélectionnez « Options Internet »</li>
          <li>Cliquez sur l’onglet « Confidentialité »</li>
          <li>Cliquez sur « Avancé » et décochez « Accepter »</li>
          <li>Sauvegardez vos préférences en cliquant sur « OK »</li>
        </ol>
        <ul><li><strong>Google Chrome</strong> :</li></ul>
        <ol>
          <li>Ouvrez Google Chrome</li>
          <li>Cliquez sur l’icône d’outils dans la barre de menu</li>
          <li>Sélectionnez « Options »</li>
          <li>Cliquez sur l’onglet « Options avancées »</li>
          <li>Dans le menu déroulant « Paramètres des cookies », sélectionnez « Bloquer tous les cookies »</li>
        </ol>
        <ul><li><strong>Safari </strong>:</li></ul>
        <ol>
          <li>Ouvrez Safari</li>
          <li>Dans la barre de menu en haut, cliquez sur « Safari », puis « Préférences »</li>
          <li>Sélectionnez l’icône « Sécurité »</li>
          <li>À côté de « Accepter les cookies », cochez « Jamais »</li>
          <li>Si vous souhaitez voir les cookies qui sont déjà sauvegardés sur votre ordinateur, cliquez sur « Afficher les cookies »</li>
        </ol>
  jobs:
    title: "Rejoignez-nous !"
    intro: "Business Profilers, parmi les leaders du Venue Finding Français vous propose de participer au succès de son développement connu depuis 17 ans. Agence tourisme d’affaires reconnue sur le marché, nous proposons à nos clients (grands comptes, PME, multinationales, …) des solutions en matière de recherche de lieux et d’accompagnement pour l’organisation de séminaires et évènements. Vous souhaitez intégrer une entreprise orientée vers les nouvelles technologies où la relation humaine reste l’alpha et l’omega de la richesse de notre relation client ? Bienvenue chez nous !"
