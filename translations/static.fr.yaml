      body: |
        <p>BUSINESS PROFILERS recueille les informations principalement auprès de vous en tant que client. Des exemples de données personnelles que nous pourrions collecter sont le nom de votre entreprise, votre nom et d'autres détails de contact tels que le numéro de téléphone, l'adresse e-mail ou l'adresse physique. BUSINESS PROFILERS peut mettre à jour vos informations à partir d'autres dossiers publics si cela est nécessaire pour maintenir un bon entretien du référentiel de donnée.</p>
        <p>BUSINESS PROFILERS enregistre les données personnelles en relation avec :</p>
        <p>A. &nbsp; Notification d'un service offert par le biais des différentes plateformes offertes par la Société.</p>
        <p>B. &nbsp; Lorsque vous entrez votre adresse e-mail ou votre numéro de téléphone portable sur le site.</p>
        <p>C. &nbsp; Si vous nous contactez par courriel, par téléphone, par nos sites Web et par les médias sociaux.</p>
        <p>D. &nbsp; Si vous vous inscrivez à un abonnement par courriel.</p>
        <p>E. &nbsp; Votre visite de sur nos sites Web et lors de l'accès à notre application, y compris, mais sans s'y limiter, les données de trafic, les données de localisation, les blogs et d'autres données de communication, telles que l'adresse IP, le type de périphérique, le système d'exploitation et le type de navigateur utilisé pour la visite.</p>
    section3:
      title: "Collecte avec consentement"
      body: |
        <p>En cliquant sur le bouton "Accepter / Fermer", vous consentez à ce que les données personnelles (société, nom, numéro de téléphone et adresse électronique) que vous entrez dans des formulaires à différents endroits sur ce site puissent être utilisées à des fins de marketing pour les services auxquels vous êtes exposé lorsque vous êtes invité à remplir vos informations personnelles. Nous recueillons également votre adresse IP, votre position géographique et vos intérêts afin de mieux adapter notre marketing à vos besoins.</p>
        <p>En cliquant sur le bouton " Accepter / Fermer", vous acceptez également que nous puissions ajouter un cookie tiers sur votre ordinateur à partir de la Société. Ce cookie vous suivra, ainsi que votre comportement en ligne sur d'autres sites Web, afin de vous proposer du marketing basé sur votre comportement en ligne.</p>
        <p>Comment nous utilisons les informations collectées</p>
        <p>La Société traite les données personnelles principalement aux fins indiquées ci-dessous et à toute autre fin mentionnée lors de la collecte :</p>
        <ul>
          <li>Exécuter les fonctionnalités à travers l'une des plateformes offertes par la Société.</li>
          <li>Permettre un bon service à la clientèle, comme la gestion de vos demandes, la correction d'informations incorrectes ou l'envoi d'informations que vous avez demandées, par exemple la newsletter, des livres blancs, de la documentation.</li>
          <li>Pour gérer les profils clients, réaliser des analyses et des études de marché.</li>
          <li>Pour l'administration du système et pour obtenir des données statistiques sur le comportement et les usages de nos utilisateurs.</li>
          <li>Pour développer, livrer et améliorer nos produits et services par l'analyse de votre comportement sur nos sites web et nos applications.</li>
          <li>Les données personnelles sont également utilisées à des fins d'analyse pour réaliser des segmentations et ciblages, afin de développer des offres et des services personnalisés.</li>
          <li>Pour vous envoyer des informations et des promotions par SMS, email, app, push ou d'autres voies de contact numériques telles que les médias sociaux puisque vous avez une relation client active avec nous.</li>
          <li>Pour vous contacter via l'application, SMS, email ou courrier sur d'autres offres, promotions ou services que nous pensons être d'intérêt pour vous, veuillez noter que vous pouvez refuser cette promotion à tout moment.</li>
          <li>Vous fournir des recommandations pertinentes, des offres et des services personnalisés basés sur les besoins d'autres personnes ayant des comportements similaires aux vôtres.</li>
          <li>Pour nous aider à développer notre site et notre application afin d'être plus utiles et d'améliorer votre expérience utilisateur des services offerts par la Société en personnalisant l'affichage des services à votre profil.</li>
          <li>Envoyer des messages importants en tant que communication sur les changements dans nos mentions légales.</li>
        </ul>
        <p>Nous pouvons partager des informations avec d'autres sociétés qui traitent des données en notre nom afin d'exécuter nos services, c'est-à-dire l'analyse, la distribution ou d'autres services pour maintenir et appliquer nos conditions d'utilisation et de livraison. Cependant, le traitement des données personnelles garantit toujours une sécurité et une confidentialité élevées.</p>
        <p>La société ne collabore qu'avec des partenaires qui traitent des données à caractère personnel au sein de l'UE/EEE.</p>
    section4:
      title: "À propos des cookies"
      body: |
        <p>Lorsque vous utilisez notre site et notre application, des données personnelles peuvent être collectées par le biais de cookies. Cela ne peut se faire qu'avec un consentement distinct. Ceci stockera les informations sur votre utilisation et les pages visitées. Il peut s'agir d'informations techniques sur votre appareil et votre connexion Internet telles que le système d'exploitation, la version du navigateur, l'adresse IP, les cookies et les identifiants uniques. Lorsque vous visitez nos sites Web où nos services sont présentés, différentes techniques peuvent être utilisées pour vous reconnaître afin d'en apprendre davantage sur nos utilisateurs. Cela peut se faire directement ou au moyen d'une technologie tierce.</p>
    section5:
      title: "Droit à l'oubli, stockage et divulgation des données personnelles"
      body: |
        <p>Vous pouvez à tout moment retirer votre consentement en nous en faisant la demande via la fonction "nous contacter"</p>
        <p>Le traitement est conforme à la législation en vigueur et signifie que les données personnelles ne sont pas conservées pendant une période plus longue que nécessaire aux fins du traitement. La Société conservera vos données personnelles tant que vous serez en relation commerciale avec nous. A des fins de marketing, les informations datant de plus de 4 ans ne sont pas utilisées. Cela implique que les données seront effacées lorsqu'elles ne sont plus pertinentes ou nécessaires à des fins d'analyse ou de marketing direct aux fins pour lesquelles elles ont été collectées. Certaines informations peuvent être conservées plus longtemps au besoin en raison d'autres exigences légales. Cependant, le traitement des données personnelles garantit toujours une sécurité et une confidentialité élevées.</p>
    section6:
      title: "Vos droits et vos choix"
      body: |
        <p>Vous avez des droits sur vos données personnelles et vous pouvez demander la modification ou destruction de vos données sauvegardées. La Société rectifiera, de sa propre initiative ou à l'initiative du client, les données jugées incorrectes. Vous pouvez également demander à tout moment que vos données soient effacées ou que leur utilisation soit limitée en nous contactant (voir la rubrique "Nous Contacter"). Si vous pensez que nous ne respectons pas vos droits, veuillez contacter la Société ou contacter l'Autorité de Protection des Données de votre pays, à http://ec.europa.eu/justice/data-protection/article-29/structure/data-protection-authorities/index_fr. htm.</p>
        <p>Vous pouvez à tout moment vous abstenir de recevoir des communications marketing de notre part en mettant à jour les paramètres de votre compte en cliquant sur "Se désinscrire" dans l'e-mail et les communications SMS que nous vous envoyons. Vous êtes toujours les bienvenus pour contacter notre service clientèle pour vous aider à stopper nos communications.</p>
    section7:
      title: "Liens vers d'autres sites"
      body: |
        <p>Dans le cas où notre site contient des liens vers des sites Web de tiers, des sites Web ou des documents publiés par des tiers, ces liens sont fournis à titre d'information seulement. Étant donné que la Société n'a aucun contrôle sur le contenu de ces sites Web ou de son matériel, nous ne sommes pas responsables de leur contenu. La Société n'est pas non plus responsable des dommages ou pertes qui pourraient résulter de l'utilisation de ces liens.</p>
    section8:
      title: "Comment nous contacter"
      body: |
        <p>Pour plus d'informations sur la gestion des données personnelles ou si vous avez des questions, n'hésitez pas à nous contacter :</p>
        <p>BUSINESS PROFILERS, 1 avenue du Général de Gaulle 60500 Chantilly</p>
        <p>Cette politique de confidentialité s'applique à partir du 01/01/2021</p>
  solutions_covid:
    breadcrumb: "Quelles solutions pour organiser mes événements durant la période Covid ?"
    title: "Quelles solutions pour organiser mes évènements durant la période Covid ?"
    intro_p1: "Vous trouverez dans cette thématique quelques astuces selon votre format d’événement (Digital, hybride ou physique).&nbsp;"
    intro_p2: "C’est avec plaisir que vous pouvez joindre nos chefs de projets qui vous partageront leurs expériences mais aussi les retours clients qui sont parfois la meilleure garantie de trouver «&nbsp;une pépite&nbsp;» pour son besoin.&nbsp;"
    digital:
      title: "L’Évènement Digital"
      body: |
        <p>&nbsp;</p>
        <p>Tout l’enjeu est de donner un maximum d’interactivité afin de ne pas perdre le lien avec vos participants et ainsi ne pas reproduire une énième réunion «&nbsp;zoom&nbsp;»…</p>
        <p><i><strong>Le choix du lieu </strong></i>: Optez pour une conférence interactive depuis vos bureaux ou en retransmission live depuis un plateau TV&nbsp;</p>
        <p><i><strong>L’outil</strong></i><strong> </strong><i><strong>c’est l’assurance d’un évènement fluide </strong></i>: Redoublez de vérifications en testant l’outil en amont de l’évènement avec l’ensemble des intervenants afin d’anticiper les problématiques techniques et appréhender les fonctionnalités de l’application. La performance technique et la capacité de diffusion de l’outil doivent être adaptées à votre jauge de participants. Adaptez votre fond de retransmission à la thématique de votre événement, la personnalisation est toujours possible en virtuel.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>Les intervenants : </strong></i>Faites intervenir des intervenants de qualité durant votre conférence et n’hésitez pas à faire appel à des journalistes TV comme modérateurs de votre événement et ainsi assurer un rythme et ne pas perdre votre auditoire.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>L’interactivité c’est la clé du succès : </strong></i>Distribuez la parole, donnez lieu à des temps de questions/réponses et faites intervenir des prestataires originaux comme un caricaturiste qui reprendra les thématiques et les intervenants de votre session.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>Rebondir sur son évènement virtuel : </strong></i>Il est vrai que l’évènement virtuel démontre certaines limites dans la création d’émotions ou encore dans la communication de certains messages. Cependant c’est un parfait tremplin pour créer du contenu et ainsi faire vivre son évènement dans ses communications avec les interlocuteurs concernés.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><br><br>&nbsp;</p>
    hybrid:
      title: "L’Évènement Hybride"
      body: |
        <p>La parfaite alternative entre digital et physique, permettant de réunir les avantages des deux formats et sans contraintes. En complément de l’évènement digital certains aspects sont à prendre en compte.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>Le choix du lieu </strong></i>: Le choix du lieu devient stratégique, tous les lieux ne disposent pas d’infrastructures permettant une réalisation de qualité (débit de connexion, gestion des flux, format de la plénière, régie, etc…). Optez donc pour un lieu rodé à ce type de prestations et capable de vous accueillir dans les meilleures conditions.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>Le choix du partenaire technique : </strong></i>Le choix de votre partenaire audiovisuel devient alors stratégique, ce dernier doit de préférence être référencé au sein du lieu sélectionné car ce dernier disposera déjà d’une parfaite connaissance du lieu et de ses spécificités techniques.&nbsp;</p>
    physical:
      title: "L’Évènement physique&nbsp;"
      body: |
        <p>Source d’émotions, créateur de liens répondant à de nombreux enjeux des entreprises, ce format inconditionnel demeure le plus plébiscité par les prescripteurs qui continuent d’organiser des événements en présentiel. Quelques spécificités sont à prendre en compte dans le contexte actuel&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>Le choix du lieu :</strong></i><strong> </strong>Optez pour des lieux «&nbsp;safe&nbsp;» afin d’organiser un évènement en toute sérénité. Pour ce faire, privilégiez des lieux disposant d’un protocole sanitaire rigoureux, si possible labélisés (Bureau Veritas, Socotec etc… ) mettant à disposition des équipes spécifiques assurant la gestion des flux, le respect de la distanciation.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>La localisation : </strong></i>Un lieu au vert où l’on respire avec de grands espaces permettra de créer un contexte de sérénité pour les participants et ainsi favoriser les échanges dans le respect des distanciations.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>Les salles de réunion : </strong></i>n deux mots spacieuses et aérées, n’hésitez pas à choisir de grandes salles de réunions pour assurer une distanciation pour vos participants et ne pas être restreints dans un format imposé.&nbsp;</p>
        <p><br><br>&nbsp;</p>
        <p><i><strong>La restauration : </strong></i>Il s’agit du pied de pivot depuis le début de la crise sanitaire, les repas assis et les pauses individuelles sont à privilégier mais il est peut-être toujours opportun de s’assurer de la possibilité de livraison de plateaux repas.&nbsp;</p>
  about:
    intro_body: |
      <p><strong>BUSINESS PROFILERS COMBINE LES TALENTS D’UN VENUE FINDER, D’UNE AGENCE EN TOURISME D’AFFAIRES POUR ACCOMPAGNER LES ENTREPRISES :</strong></p>
      <p>Nous nous adressons aux PME comme aux grands groupes français ou aux multinationales. Que vous soyez responsable évènementiel, assistante de service, organisateur ou acheteur de prestations hors production, nous avons la solution adéquate et l’expertise dont vous avez besoin.</p>
      <p>Nous coordonnons tous types d’évènements d’entreprise : séminaire, formation, convention, lancement de produit, assemblée générale, soirée de gala, incentive, réunion de force de ventes, comité stratégique ou de pilotage…</p>
      <p>Favoriser la réussite de vos projets, optimiser vos ressources et vos coûts, minimiser vos risques : voilà nos missions.</p>
      <p>Notre organisation est entièrement tournée vers votre satisfaction : Altruisme et intégrité sont nos principales valeurs</p>
      <p>Grâce à notre savoir-faire, vous trouverez le lieu ou le prestataire pour l’organisation d’un évènement ou le développement d’une stratégie de globalisation au niveau national ou international avec pour effets principaux :</p>
      <ul>
        <li>Le gain de temps avec des solutions rapides, pertinentes et transparentes</li>
        <li>La réduction du nombre de prestataires et la simplification de votre processus achats</li>
        <li>Une vision claire sur le poste séminaires et évènements de votre entreprise.</li>
        <li>Un accompagnement personnalisé</li>
        <li>Une analyse de la performance</li>
      </ul>
      <p>Nous sommes là pour vous simplifier la vie en vous apportant des solutions efficaces dans le respect des contraintes, de la réglementation et de vos enjeux.</p>
    history:
      title: "Historique"
      body: |
        <p><strong>2005</strong> : Création de Business Profilers spécialiste de recherche de lieux pour évènements d’entreprise en France<br><strong>2010 </strong>: Business Profilers s’ouvre sur l’international et développe ses partenariats&nbsp;sur l’Espagne, le Portugal et le Maroc avec un bureau à Barcelone.<br><strong>2013 </strong>: Lancement de partenariat avec le Royaume-Uni, l’Irlande et l’Allemagne.<br>Business Profilers est accrédité Atout France avec sa Licence d’opérateur de voyages en tourisme d’affaires sous le n° IM060130005 et sa garantie financière.<br><strong>2014 </strong>: Lancement de partenariat avec les&nbsp;USA et le Vietnam.<br><strong>2015 </strong>: Lancement de partenariat avec l’Italie et le Benelux</p>
    organization:
      title: "Organisation"
      body: |
        <p><strong>La relation humaine est au cœur de notre organisation !</strong></p>
        <p>Les fondateurs de Business Profilers sont présents sur le marché du M.I.C.E (Meeting, Incentive, Conference, Event) depuis plus de 30 ans. Ils ont œuvré pour les plus grandes chaînes hôtelières internationales et sont rompus à satisfaire les besoins les plus exigeants des entreprises dans l’organisation de leurs séminaires et évènements d’entreprise.</p>
        <p>Pour les accompagner dans ce projet, ils ont organisé Business Profilers autour de deux pôles :</p>
        <p><strong>Le pôle Sélection de prestataires : Business Premium</strong></p>
        <p>Business Profilers a confié à la société Business Premium sur des critères de qualité très rigoureux la sélection de l’élite du tourisme d’affaires que nous mettons à votre disposition sur nos sites Internet. Ce qui apporte une garantie de qualité à tous nos clients organisateurs d’évènements. A la différence de la plupart de nos confrères notre base de données est privée et nous connaissons l’ensemble des partenaires que nous vous proposons. Nous travaillons avec eux depuis de nombreuses années et grâce aux études de satisfaction réalisées après chaque évènement, nous affichons un taux de performance de 98.9% sur les 5000 derniers évènements réalisés.</p>
        <p><strong>Le Pôle Relation clients qui s’appuie </strong>:</p>
        <ul>
          <li>sur une équipe d’experts multilingues issus du monde de l’hôtellerie ou de l’organisation d’évènements,</li>
          <li>une sélection de partenaires internationaux,</li>
          <li>des outils de communication spécialement développés pour fluidifier la relation commerciale.</li>
        </ul>
        <p>Après avoir travaillé pendant des années au cœur des services opérationnels des principaux acteurs du tourisme d’affaires, ils sont à vos côtés chez Business Profilers pour vous accompagner dans la réussite de vos projets. Ils connaissent très bien le marché et l’ensemble des opérateurs. Ils sont les garants de votre sécurité, en effet, ils savent que l’organisation de votre évènement ne peut pas laisser place à l’improvisation !</p>
    commitments:
      title: "Nos engagements"
      body: |
        <p><strong>Business Profilers vous garanti :</strong></p>
        <ul>
          <li>des solutions idéales en un temps record</li>
          <li>une relation commerciale personnalisée</li>
          <li>un suivi avant, pendant et après l’évènement</li>
          <li>la transparence des prix, des contrats, des produits et des services</li>
          <li>du meilleur rapport qualité/prix/prestation du marché en vous appuyant sur notre puissance d’achat et les meilleures conditions d’achat et d’annulation</li>
        </ul>
        <p><strong>L’engagement de nos prestataires :</strong></p>
        <ul>
          <li>Répondre à nos demandes de disponibilité sous 4 heures</li>
          <li>Éditer un devis sous 24 heures pour un hôtel ou un lieu</li>
          <li>Vous fournir un accueil personnalisé lors de votre visite de repérage puis lors de la réception de vos invités</li>
          <li>Vous apporter un service d’excellente qualité</li>
          <li>Vous faire bénéficier du meilleur rapport qualité/prix/prestation en vigueur à la date indiquée et des meilleures conditions d’achat et d’annulation</li>
        </ul>
    footer_title: "D’un comité exécutif de 6 personnes à une convention de 3000 personnes, Business Profilers, c’est une synergie de talents au service de la réussite de vos projets !"
  seminaire_cohesion:
    section_cohesion:
      title: "SÉMINAIRE DE COHÉSION"
      p1: "Vous souhaitez aider votre équipe à se retrouver, à se consolider, à se souder pour réussir à passer à travers les challenges présents et à venir. C’est lors de cet instant de partage qu’il faut trouver les appuis pour renforcer les liens au quotidien."
      p2: "Comment être cohérent en évitant le déjà-vu ? Quelles activités proposer pour favoriser l’inclusion de tous les participants ?"
      p3: "Business Profilers est force de proposition pour vous suggérer de multiples activités de <strong>team building</strong> spécifiquement conçues pour les lieux conseillés."
      p4: "Créer la surprise vous permet de faire vivre longtemps après votre séminaire la cohésion de vos équipes"
    section_motivation:
      title: "SÉMINAIRE DE MOTIVATION"
      p1: "Vous souhaitez offrir du bien-être à vos collaborateurs pour stimuler leurs performances et leurs réussites."
      p2: "Pour les booster, choisirez-vous un événement ludique, sportif, culturel, gastronomique ?"
      p3: "Business Profilers vous recommande des solutions sur mesure pour favoriser le travail de groupe en permettant à chacun de se découvrir et se révéler."
      p4: "Vos collaborateurs en reviendront enchantés et en redemanderont !!!!"
  seminaire_force:
    title: "Séminaire de force de vente interne ou réseau"
    section_internal:
      title: "RÉUNION DE FORCE DE VENTE INTERNE"
      p1: "Le chiffre d’affaires est votre crédo, il ne peut pas ne pas être atteint ! Vous devez compter sur l’efficacité de chaque membre de votre équipe commerciale. Vous allez intégrer, former, informer, motiver, dynamiser, souder votre équipe pour prendre des parts de marché…"
      p2: "Business Profilers vous aide à booster vos champions et vous trouve le lieu et les activités propices afin de récompenser et amplifier leurs talents !"
    section_network:
      title: "RÉUNION DE FORCE DE VENTE DE RÉSEAU"
      p1: "Vous souhaitez réunir votre réseau de concessionnaires pour leur présenter vos nouveautés, les dynamiser et les valoriser."
      p2: "En France ou à l’étranger ? Vous allez combiner travail, détente, moments de partage et de convivialité pour favoriser le sentiment de fierté d’appartenance."
      p3: "Business Profilers vous propose son expérience internationale autour de ses partenaires rompus à satisfaire ces enjeux !"
      p4: "Après cette expérience réussie qualité et chiffre d’affaires sont au rendez-vous !"
  seminaire_formation:
    section_training:
      title: "SÉMINAIRE DE FORMATION"
      p1: "Vous souhaitez former vos collaborateurs et les recevoir dans un endroit différent de leur milieu professionnel habituel, leur offrir un lieu atypique et inspirant, propice à la concentration qui va leur permettre de prendre le recul nécessaire à la réflexion pour profiter pleinement du sujet traité, tel est votre enjeu !"
    section_location:
      title: "OÙ ORGANISER CE SÉMINAIRE DE FORMATION ?"
      p1: "Dans votre capitale, en province, dans votre métropole régionale, dans une demeure de caractère à la campagne, à la mer ou la montagne, dans un site très contemporain, dans un lieu facile d’accès, nous avons un large choix de possibilités à vous suggérer selon vos objectifs et votre budget.<br>Donnez-nous votre cahier des charges et nous vous apportons la solution idéale !<br>Notre recommandation de lieux et prestataires est déterminante pour le succès de votre formation."
    section_integration:
      title: "SÉMINAIRE D’INTÉGRATION"
      p1: "Vous souhaitez exceller dans l’accueil de vos nouveaux collaborateurs, les réunir dans un lieu propice à l’échange afin qu’ils puissent tisser des liens solides avec toute l’équipe : c’est là votre mission !<br>Quel lieu, quelles activités, quels concepts proposer à ces nouveaux collaborateurs ?<br>Les experts « Profilers » sont là pour vous conseiller dans cette dynamique et vous apporter les meilleures solutions !<br>Notre proposition de concept d’intégration est un des facteurs clés pour faciliter l‘accueil de vos nouveaux collaborateurs."
  seminaire_management:
    title: "Séminaire de management ou direction"
    section_management:
      title: "SÉMINAIRE DE MANAGEMENT"
      p1: "Vous souhaitez réunir vos cadres pour parler : stratégie, gestion des ressources humaines, budgétisation, travailler sur les méthodes… Optimiser l’implication des participants, renforcer les messages et faciliter leurs appropriations tels sont vos enjeux !"
      p2: "Que ce soit pour une journée ou sur plusieurs modules pour des programmes récurrents, nous vous proposons la solution la plus adaptée"
      p3: "Faire appel à Business Profilers pour trouver le cadre approprié de votre séminaire de management, c’est vous assurer d’un accompagnement sur mesure pour garantir la réussite de votre événement."
      p4: "Parce que la forme est aussi importante que le fond, Business Profilers met toute son expérience à votre service !"
    section_direction:
      title: "SÉMINAIRE DE DIRECTION"
      p1: "C’est un moment important pour vos cadres supérieurs et dirigeants de faire le point sur la situation de votre société. Prendre le temps de l’analyse et du partage, définir les nouveaux objectifs à venir, la nouvelle stratégie à adopter…"
      p2: "Quel environnement sera le plus favorable à cet échange ? Complétement studieux ou quelque peu ludique ? En France ou à l’étranger ? Luxueux ou décalé ?…"
      p3: "Les experts « Profilers » sont là pour vous conseiller et vous apporter les meilleures solutions !"
      p4: "Le lieu, le « before », le « after » sont avec la réunion les clés du succès de votre séminaire de direction."
  top10:
    breadcrumb: "Top 10 des Lieux Insolites"
    title: "Top 10 des Lieux Insolites"
    item1:
      title: "VILLAGE IGLOO LES ARCS"
      p1: "Casser les codes ou simplement passer une belle soirée entre collègues à la montagne ? A seulement 30 minutes en bus de Bourg Saint Maurice, le Village Igloo des Arcs est l'endroit idéal pour une journée et une soirée inoubliable !"
      p2: "Au programme : descente en luge, apéro givré, cocktail dînatoire, soirée dansante… La soirée à l'igloo peut se construire sur mesure pour répondre à vos attentes !"
    item2:
      title: "LA ROCHE COULOIR"
      p1: "La Roche Couloir vous accueille pour des événements professionnels. Entouré de plusieurs hectares de forêt, le Domaine vous accueille dans une ambiance conviviale, et sereine. La Roche Couloir est à votre disposition un espace inspirant et paisible pour organiser tous types d'événements."
    item3:
      title: "SAINTE-CROIX PARC ANIMALIER"
      p1: "Immersion totale au cœur de la nature et à proximité immédiate des animaux. Une expérience qui permettra à vos collaborateurs de se ressourcer, de stimuler leur inspiration et de se reconnecter à l’essentiel."
    item4:
      title: "LES CABANES DANS LES BOIS"
      p1: "Une situation exceptionnelle des Cabanes dans les bois dans le sud de la France, à 60 minutes de Toulouse et de Montpellier, vous permet d’y installer votre camp de base pour une séminaire en pleine nature et profiter des plus beaux sites touristiques du Pays Cathare, du midi toulousain et du Languedoc-Roussillon tout en profitant d’un cadre de séjour authentique."
    item5:
      title: "LE CHÂTEAU DES PÈRES"
      p1: "Envie d’un lieu atypique ou d’un espace intimiste pour une réunion d’affaire ou de grands espaces pour vos séminaires ? Le Château des Pères met à votre disposition pour ces temps d’échange 8 salles de 18 à 200m² son Parc de Sculptures de 31 hectares, et désormais une orangerie de 1000m², unique en Bretagne."
    item6:
      title: "BO RANCH"
      p1: "BO RANCH, nouvel écrin pour tous vos événements d’entreprise, offre un cadre idyllique pour se réunir, célébrer & partager des moments authentiques. Doté d’un chaleureux Club House de 750m2 et de plusieurs espaces haut de gamme avec une vue imprenable sur la nature et les chevaux, BO RANCH accueille tout type d’événement…"
    item7:
      title: "ROCK ET BLEAU"
      p1: "Situé à moins d’une heure de Paris, un endroit vert, insolite avec un concept nature pour votre séminaire ambiance conviviale. La société Rock & Bleau spécialisée dans l’événementiel dans la région Bellifontaine vous accueille sur le site familial de la Maison du Rocher de Fontainebleau. En adéquation à un besoin ou un enjeu stratégique auquel votre équipe concorde, Rock & Bleau est en mesure de vous offrir sur un même lieu, dans un cadre chaleureux et international."
    item8:
      title: "LÀ-HAUT"
      p1: "Hébergements insolites, recyclés des grandes expéditions polaires françaises, nos Shelters ont été pensés pour vous offrir un refuge confortable et original. Sur place, c’est une véritable fenêtre sur le monde, entre le lac d’Annecy et le Mont-Blanc, qui s’offre à vous et à vous seul. Tout au long de votre séjour, notre équipe est présente, sur place, avec vous. Elle veille à anticiper vos attentes et satisfaire vos désirs pour garantir la réussite de vos réunions professionnelles."
    item9:
      title: "DIHAN ÉVASION"
      p1: "Dihan vous propose une prestation à part pour vos séminaires : nature, insolite et marquante pour vos collaborateurs. De la demie journée, ou journée au séminaire résidentiel d’une à plusieurs nuits, nous saurons concocter avec vous un séjour qui surprendra votre équipe : salles chaleureuses et équipées, configurations multiples, espaces d’exception ouverts sur la nature, prestations de restauration et propositions d’activités. La structure est également idéale pour les réunions de cadres ou RV décisionnels (tranquillité et discrétion assurées)."
  atypique:
    breadcrumb: "Un évènement atypique de A à Z"
    title: "Un événement atypique de A à Z"
    intro: "Un événement est une succession de temps forts dont le rythme et l’originalité permettront de délivrer un message qui continuera de vivre après ce dernier.&nbsp;"
    transport:
      title: "Le transport oui, mais alors autrement&nbsp;!"
      p1: "Souvent considérer comme du temps « perdu&nbsp;», il ne tient qu’à vous de transformer ce moment en une belle opportunité de créer du lien et assoir le contexte de votre événement&nbsp;:"
      list: |
        <ul>
          <li>Privatisé une voiture SNCF et organiser un teambuilding à l’intérieur&nbsp;: Une murder Party ou encore une dégustation des produits régionaux de votre destination.&nbsp;</li>
          <li>En voiture c’est bien, en 2cv c’est mieux&nbsp;! optez pour des trajets en 2 CV pour donner un côté bucolique à votre début d’événement.&nbsp;</li>
        </ul>
    venue:
      title: "Donner du sens à votre choix de lieu."
      p1: "Le lieu sera l’âme de votre événement. Il faut donc à la fois surprendre vos convives mais aussi qu’il colle avec votre thème, votre message et/ou bien évidemment votre public.&nbsp;"
      p2: "Certains lieux se suffisent à eux même, et d’autres ouvrent le champ des possibles en termes d’aménagement ou de décoration."
    format:
      title: "Jouons sur le format.&nbsp;"
      p1: "Pour certains événements vous aurez besoin de faire passer des messages plus ou moins forts. Le format de vos réunions, selon le nombre de participants pourra les aider à bien l’assimiler.&nbsp;"
    catering:
      title: "Restauration."
      p1: "On se souviendra toujours de ce qu’on avait dans notre assiette…et c’est aussi l’un des aspects les plus importants de votre événement. La qualité des plats, du service, mais aussi de l’originalité est d’une grande importance et participera à la réussite de votre événement. Aujourd’hui la restauration peut aussi servir l’appui du RSE avec des traiteurs locaux qui vous feront découvrir les spécialités de la région ou bien encore des traiteurs engagés, qui emploierons des personnes en réinsertion. Le panel est infini, en voici quelques pistes&nbsp;:&nbsp;"
    animate:
      title: "Inspirer, Nourrir & Motiver."
      p1: "Parce l’animation va rendre votre événement unique et va marquer les esprits des participants, il est important de surprendre et capter leur attention tout en coordonnant bien le fil rouge de votre événement :&nbsp;"
    evening:
      title: "Soirée.&nbsp;"
      p1: "Votre événement pourra également être ponctué d’une animation tout au long de la soirée ou bien par touche. Pour cela vous pouvez vous appuyer sur votre lieu quand celui-ci a une identité forte, ou bien le créer et axer votre décoration sur le thème de la soirée.&nbsp;"
    gift:
      title: "Gift.&nbsp;"
      p1: "Proposer des cadeaux à vos invités lors d’un événement, c’est faire preuve d’une attention particulière à leur égard tout en mettant en œuvre une action de communication efficace, à condition de choisir stratégiquement les objets offerts. Ce rôle a évolué, et offrir un simple stylo ne suffit plus ! Il faut aujourd’hui pousser la réflexion pour offrir des attentions responsables et tendances que les invités souhaiteront conserver une fois l’événement terminé, cela peut être l’occasion pour vous d’affirmer votre démarche RSE."
      p2: "Spécialités régionale (ex. Pour Lyon&nbsp;: Les traditionnelles pralines, une bougie de L’atelier de Louis (fabrication française et artisanale) ou encore une praluline)"
      p3: "Cadeaux orienté RSE&nbsp;: Gourde personnalisée&nbsp;; Tote Bag, boite à masque (spécial post Covid-19)"
