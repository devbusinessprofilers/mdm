  assemblee:
    title: "Assemblée générale ou convention d'entreprise"
    section_assembly:
      title: "ASSEMBLÉE GÉNÉRALE"
      p1: "Vous devez informer, rendre des comptes et surtout convaincre"
      p2: "L’atmosphère doit être chaleureuse, confortable, Il est donc nécessaire d’harmoniser le choix du lieu avec le reflet du message et le public des participants. Prévoir des outils de communication performants pour valider le nombre de participants et faire émarger les feuilles de présence, faciliter les votes et donc les décisions validées tels sont les enjeux de votre assemblée générale."
      p3: "Business Profilers vous propose les meilleures salles, traiteurs, prestations techniques qui garantissent aux administrateurs les conditions optimum pour emporter l’adhésion."
      p4: "Ordinaire ou extraordinaire, l’assemblée générale avec Business Profilers est toujours synonyme de succès !"
    section_convention:
      title: "CONVENTION D’ENTREPRISE"
      p1: "Vous souhaitez de l’interactivité avec vos salariés et créer un lien véritable pour les mobiliser autour d’un projet fédérateur."
      p2: "Vous avez trouvé les thèmes porteurs, défini quels seront les intervenants qui vont apporter un éclairage pertinent pour l’animation de cet évènement.<br>Il est temps de choisir un lieu adapté à votre budget en adéquation avec vos messages et votre image."
      p3: "Oser le changement, soigner la scénographie, jouer la cohésion et privilégier l’interactivité sont autant de facteurs clés de succès de votre convention d’entreprise !"
      p4: "Business Profilers vous accompagne pas à pas dans ce process et même au-delà ! Une fois la convention achevée, évaluer son impact à chaud sera l’ultime étape décisive qui vous permettra de préparer la prochaine !"
      p5: "Les participants à votre convention sont les meilleurs ambassadeurs pour transmettre votre message bien au-delà du cadre de votre entreprise, c’est le pari gagnant !"
  model:
    placeholder: "Lorem ipsum…"
  how_it_works:
    lead_title: "LA MÉTHODOLOGIE DE NOTRE PÔLE CLIENT :"
    p1: "Toute notre équipe et celle de nos prestataires œuvrent en synergie autour d’un objectif commun : le succès de votre évènement d’entreprise !"
    p2: "Pour faciliter votre travail et garantir le succès de votre manifestation, Business Profilers vous assure un accompagnement tout au long de votre parcours, de la demande d’information jusqu’à l’évaluation finale de <strong>l’organisation de votre évènement</strong>."
    p3: "Vous aurez un <strong>expert «profiler»</strong> dédié à votre écoute, disponible, efficace et réactif. Son rôle est de bien comprendre votre cahier des charges, vos enjeux pour pouvoir vous conseiller utilement. Il connaît l’ensemble des prestataires que nous avons sélectionné et ses conseils sont précieux et avisés."
    section1:
      title: "1/ La définition de vos besoins"
      lead: "Valider votre cahier avec des experts du tourisme d’affaires, c’est rassurant !"
      item1: "Dès que vous avez décidé d’organiser une conférence, un séminaire, un incentive, un team building ou un évènement, contactez nos experts au 03 44 555 444."
      item2: "Ils sont à votre écoute 5 jours sur 7 de 9H à 18H 30, pour vous apporter un service personnalisé."
    section2:
      title: "2/ Recherche des solutions adaptées dans votre cadre budgétaire :"
      item1: "Votre <strong>expert « profiler»</strong> identifie les lieux, les prestataires et les agences de communication qui correspondent à votre demande, s’assure de leurs disponibilités et leur communique votre cahier des charges"
      item2: "Dans la demi-journée suivant votre demande, il vous transmet sa recommandation de lieux et prestataires qui répondent à vos besoins et disponibles à vos dates, avec une présentation détaillée de chaque site."
      p1: "Vous disposez d’une sélection de lieux et de prestataires disponibles sous 4 heures et selon la formule retenue vous recevez directement les devis des prestataires ou une offre globalisée de Business Profilers."
    section3:
      title: "3/ L’accompagnement de votre projet jusqu’au jour de l’évènement"
      lead: "Deux formules vous sont proposées :"
      item1: "Vous êtes en relation avec les prestataires et finalisez vous-même votre projet,"
      item2: "Vous avez un <strong>expert</strong> qui vous est dédié et pilote tout le projet avec vous."
    section4:
      title: "4/ La coordination de votre projet sur site"
      p1: "C’est un service + optionnel."
      p2: "Les missions de vos coordinateurs d’évènement sont essentielles : anticiper, coordonner, contrôler, réagir aux changements éventuels pour optimiser le service fourni… ainsi vous êtes tranquille et vous pouvez vous concentrer sur les relations avec vos invités en toute sérénité."
    section5:
      title: "5/ Analyse de la satisfaction"
      p1: "Dès la manifestation réalisée, nous évaluons avec vous la qualité de la prestation de l’établissement au regard de vos attentes et de ses engagements de qualité. Le taux de satisfaction actuel est de 98.9 % sur les 5000 derniers évènements réalisés."
    section6:
      title: "6/ Reporting centralisé dans le cadre du service Centralisation d’achats"
      p1: "Nous assurons le rapprochement financier post- évènement pour éditer et solder la facture finale ou pour vous apporter en plus les tableaux de bords définis à l’avance qui vous permettrons d’avoir une vision globale sur l’ensemble de vos projets."
    section7:
      title: "7/ Mise en place d’un « programme éducatif » vous permettant de mieux connaître le tourisme d’affaires international"
      p1: "Notre équipe anime de nombreuses conférences sur les bonnes pratiques liées à l’organisation de séminaires et évènements d’entreprise, qui sont disponibles."
      p2: "Grâce aux relations que nous entretenons avec nos fournisseurs, vous pouvez participer à des programmes éducatifs de découverte de sites, de destinations ou d’animations : séjour découverte, programme hosted buyers, etc."
  comment_mieux_acheter:
    breadcrumb: "Comment mieux acheter mes évènements ?"
    title: "Comment mieux acheter mes événements ?"
    section1:
      title: "1. Quels jours privilégier pour un meilleur tarif ?"
      p1: "La date de votre séminaire a un impact important sur le prix des prestations proposées."
      p2: "Privilégier le début de semaine, le lundi et le mardi sont des jours très peu demandés. En conséquence, les lieux seront toujours prêts à fournir des efforts pour vous accueillir, à moindre frais."
      p3: "Le format mardi / mercredi est le moins aimé des hôteliers, il coupe leur semaine, et leur bloque d’éventuelles privatisations. C’est la raison pour laquelle nous recevons plus de refus sur ces jours-ci."
      p4: "Les vacances scolaires sont aussi une période creuse de l'événementiel d'entreprise. Par exemple, en juillet comme en août, les salles de séminaires et de conférences sont vides et souvent plus abordables."
    section2:
      title: "2. Haute et Basse Saison"
      high_title: "Haute Saison :"
      low_title: "Basse Saison :"
      high:
        item1: "janvier"
        item2: "Juin"
        item3: "Septembre"
      low:
        item1: "Février"
        item2: "Juillet"
        item3: "Août"
      p1: "<i><strong>Les dates de vos événements : </strong></i>Septembre / Janvier (à l’exception de la première semaine de janvier) et juin sont les plus grosses périodes de séminaires et donc une très haute saison pour les hôteliers qui sont assurés de commercialiser 100 % de leurs espaces durant ces périodes. Autrement dit un événement positionné sur fin janvier sera nécessairement plus cher qu’un événement se déroulant Mi-Octobre, peu importe la volumétrie/contingent de votre événement."
      p2: "Attention : Les zones géographiques Ski/Montagne et Bord de mer sont soumises un yield spécifique."
    section3:
      title: "3. Quand réserver mon séminaire ?"
      p1: "Le meilleur moment pour organiser votre évènement est <i><strong>3 mois avant la date d’arrivée </strong></i>de votre séminaire."
      p2: "<i><strong>L’organiser trop tard (à moins de 3 mois) : </strong></i>les lieux sont souvent déjà réservés, et vous aurez beaucoup moins de choix et un tarif plus élevé et non négociable."
      p3: "<i><strong>L’organiser trop tôt (au-delà des 3 mois) : </strong></i>les lieux ne se positionnent pas, par peur de se fermer les portes sur des demandes de privatisations, ou sur des demandes de plusieurs jours."
      p4: "Pour les demandes à partir de 150 personnes, il faut <i><strong>réserver 6 mois à l’avance</strong></i> afin d’obtenir un maximum d’adresses disponibles."
    section4:
      title: "4. Qu’est-ce que le Yield dans le MICE"
      p1: "Le marché du <i><strong>MICE</strong></i>( <strong>M</strong>eetings, <strong>I</strong>ncentives, <strong>C</strong>onferencing, <strong>E</strong>xhibitions) est un type de tourisme dans lequel les sociétés organisent des événements pour leurs employés et/ou leurs clients (séminaire, teambuilding…)"
      p2: "Le <i><strong>«Yield management» </strong></i>consiste à optimiser au maximum le prix du service en temps réel et par conséquent la marge réalisée ainsi que le chiffre d’affaires. Le prix n’est plus fixe mais évolue en fonction de la demande du consommateur et de certains critères, observés en direct.<br><br>Le prix est plus élevé lorsque la demande est importante, et vice versa (ex: billet de train ou d’avion)."
      p3: "Il est essentiel d’intégrer que le MICE (Meetings, Incentives, Conferencing, Exhibitions) est une catégorie d’achat à part entière qui s’inscrit dans une logique dépendante de nombreux facteurs :"
      p4: "<i><strong>Le format de votre événement : </strong></i>Une réservation d’évènement ayant lieu sur une semaine entière est un format très attractif pour un hôtelier.<br><br><i><strong>Le contingent : </strong></i>Selon la période celui-ci peut-être à votre avantage comme à votre désavantage. Sur une période creuse une privatisation d’un établissement sera très compétitive. À contrario sur des périodes de fortes influences, certains hôteliers préfèrent vendre plus cher leurs espaces à deux groupes différents remplissant l’établissement plutôt qu’un prix moyen négocié à un seul groupe. « Les frais de privatisation » découlent de cette logique.<br><br><i><strong>Les congrès et salons :</strong></i> Certaines périodes de congrès et salons (tels que le salon Maison &amp; Objet Villepinte) font augmenter très significativement le prix des chambres dans la zone proche mais aussi éloignée (40km pour M&amp;O).<br><br>Nous ne pouvons déterminer le prix de la chambre à la place de l’hôtel lui-même, celui-ci le détermine selon son taux de remplissage N-1 / N-2 aux mêmes dates, aux tarifs appliqués et aux capacités disponibles (Yield Management)."
  cgu:
    preamble:
      title: "Préambule"
      body: |
        <p>Les présentes conditions générales d'utilisation sont conclues entre :</p>
        <ul>
          <li>Le gérant du site internet, ci-après désigné « l’Éditeur »,</li>
          <li>Toute personne souhaitant accéder au site et à ses services, ci-après appelé « l’Utilisateur ».</li>
        </ul>
    article1:
      title: "Article 1 – Principes"
      body: |
        <p>Business Profilers propose un service d’intermédiation ou de réservation directe permettant la réservation de prestations et notamment la réservation de lieux destinés à des évènements professionnels auprès de prestataires professionnels (ci-après les «&nbsp;fournisseurs&nbsp;») et des organisateur d’évènements et réunions professionnelles (ci-après les «&nbsp;utilisateurs&nbsp;»)</p>
        <p>Les présentes conditions générales d'utilisation ont pour objet l'encadrement juridique de l’utilisation du site Business Profilers et de ses services.</p>
        <p>L’accès et l’utilisation des services sont réservés aux utilisateurs professionnels. On entend par professionnel, les personnes physiques ou morales qui exercent une activité commerciale, industrielle, artisanale ou libérale, et toute personne agissant au nom ou pour le compte d’un professionnel.</p>
        <p>Le site Internet www.businessprofilers.com est un service de :</p>
        <ul>
          <li>La société Business Profilers</li>
          <li>Située 1 avenue du Général de Gaulle CHANTILLY, France</li>
          <li>Adresse URL du site : www.businessprofilers.com</li>
          <li>E-mail : <a href="mailto:contact@businessprofilers.fr?subject=Contact" target="_self">contact@businessprofilers.fr</a></li>
          <li>Numéro de téléphone : <a href="tel:0344555444?subject=Contact" target="_self">0344555444</a></li>
        </ul>
        <p>Les conditions générales d'utilisation doivent être acceptées par tout Utilisateur, et son accès au site vaut acceptation de ces conditions.</p>
    article2:
      title: "Article 2 - Evolution et durée des CGU"
      body: |
        <p>Les présentes conditions générales d'utilisation sont conclues pour une durée indéterminée. Le contrat produit ses effets à l'égard de l'Utilisateur à compter du début de l’utilisation du service.</p>
        <p>Le site Business Profilers se réserve le droit de modifier les clauses de ces conditions générales d’utilisation à tout moment et sans justification.</p>
    article3:
      title: "Article 3 - Accès au site"
      body: |
        <p>Tout Utilisateur ayant accès à internet peut accéder gratuitement et depuis n’importe où au site Business Profilers. Les frais supportés par l’Utilisateur pour y accéder (connexion internet, matériel informatique, etc.) ne sont pas à la charge de l’Éditeur.</p>
        <p>Tout utilisateur convient :</p>
        <ul>
          <li>Être âgé de 18 ans ou plus.</li>
          <li>Représenter une personne morale ou exercer une profession libérale ou artisanale ou une entreprise individuelle.</li>
          <li>Utiliser les services de Business Profilers dans un cadre professionnel et non en tant que particulier ou consommateur.</li>
        </ul>
        <p>Le site et ses différents services peuvent être interrompus ou suspendus par l’Éditeur, notamment à l’occasion d’une maintenance, sans obligation de préavis ou de justification.</p>
        <p>L'Utilisateur du site a accès aux services suivants :</p>
        <ul>
          <li>Recherche de lieu via un moteur de recherche multicritère</li>
          <li>Consultation de fiche</li>
        </ul>
        <p>Le site comprend un espace membre réservé aux utilisateurs inscrits. Ces utilisateurs pourront y accéder en utilisant leurs identifiants de connexion.</p>
        <p>Les services réservés aux membres sont les suivants :</p>
        <ul>
          <li>Recherche de lieu via un moteur de recherche multicritère</li>
          <li>Consultation de fiche</li>
          <li>Demande de devis en direct avec des fournisseur</li>
          <li>Demande de devis avec accompagnement par un chef de projet de Business Profilers</li>
          <li>Comparaison d’offre tarifaire</li>
          <li>Confirmation d’une prestation en ayant accès aux devis et CGV des fournisseurs</li>
          <li>Service de messagerie instantanée</li>
          <li>Commande de prestation annexe</li>
          <li>Réservation d’activités</li>
          <li>Service de suivi en ligne des réservations avec historique de commande et facturation</li>
          <li>Evaluation des prestation séminaire délivrée par les fournisseurs</li>
        </ul>
    article4:
      title: "Article 4 - Responsabilités"
      body: |
        <p>Business Profilers propose un service en ligne d’intermédiation par lequel les fournisseurs proposent leurs prestations aux utilisateurs.</p>
        <p>Il est précisé que Business Profilers n’intervient qu’en tant que société prestataire de service et d’opérateur de plateforme en ligne selon la loi pour une République Numérique du 7 octobre 2016.</p>
        <p>L’ensemble des informations, devis, factures, présentation, information, renseignées par le fournisseur ne sauraient engager la responsabilité de Business Profilers. Business Profilers n’est donc pas responsable des informations contractuelles ou précontractuelles fournies par les fournisseurs sur l’espace client.</p>
        <p>La responsabilité de l'Éditeur ne peut être engagée en cas de défaillance, panne, difficulté ou interruption de fonctionnement, empêchant l'accès au site ou à une de ses fonctionnalités.</p>
        <p>Le matériel de connexion au site utilisée est sous l'entière responsabilité de l'Utilisateur qui doit prendre toutes les mesures appropriées pour protéger le matériel et les données notamment d'attaques virales par Internet. L'utilisateur est par ailleurs le seul responsable des sites et données qu'il consulte.</p>
        <p>L'Éditeur ne pourra être tenu responsable en cas de poursuites judiciaires à l'encontre de l'Utilisateur :</p>
        <ul>
          <li>du fait de l'usage du site ou de tout service accessible via Internet ;</li>
          <li>du fait du non-respect par l'Utilisateur des présentes conditions générales.</li>
        </ul>
        <p>L'Éditeur n'est pas responsable des dommages causés à l'Utilisateur, à des tiers et/ou à l'équipement de l'Utilisateur du fait de sa connexion ou de son utilisation du site et l'Utilisateur renonce à toute action contre l'Éditeur de ce fait.</p>
        <p>Si l'Éditeur venait à faire l'objet d'une procédure amiable ou judiciaire à raison de l'utilisation du site par l'Utilisateur, il pourra retourner contre lui pour obtenir indemnisation de tous les préjudices, sommes, condamnations et frais qui pourraient découler de cette procédure.</p>
        <p>Il est permis à l'Utilisateur de publier sur le site Business Profilers :</p>
        <ul>
          <li>Des messages adressés à l’éditeur ou les fournisseurs</li>
          <li>Des notes personnelles</li>
          <li>Des commentaires ou avis client</li>
          <li>Des photos ou logo</li>
          <li>Des informations personnelles</li>
        </ul>
        <p>L'Utilisateur s’engage à tenir des propos respectueux des autres et de la loi et accepte que ces publications soient modérées ou refusées par l’Éditeur, sans obligation de justification.</p>
        <p>En publiant sur le site, l’Utilisateur cède à la société éditrice le droit non exclusif et gratuit de représenter, reproduire, adapter, modifier, diffuser et distribuer sa publication, directement ou par un tiers autorisé.</p>
        <p>L’Éditeur s'engage toutefois à citer le membre en cas d’utilisation de sa publication.</p>
    article5:
      title: "Article 5 - Propriété intellectuelle"
      body: |
        <p>Tous les documents techniques, produits, photographies, textes, logos, dessins, vidéos, etc., sont soumis à des droits d'auteur et sont protégés par le Code de la propriété intellectuelle. Lorsqu'ils sont remis à nos clients, ils demeurent la propriété exclusive de Business Profilers, seul titulaire des droits de propriété intellectuelle sur ces documents, qui doivent lui être rendus à sa demande.</p>
        <p>Nos clients s'engagent à ne faire aucun usage de ces documents, susceptible de porter atteinte aux droits de propriété industrielle ou intellectuelle du fournisseur et s'engagent à ne les divulguer à aucun tiers, en dehors d'une autorisation expresse et préalable donnée par l'Editeur.</p>
    article6:
      title: "Article 6 - Liens hypertextes"
      body: |
        <p>La mise en place par l'Utilisateur de tous liens hypertextes vers tout ou partie du site est strictement interdite, sauf autorisation préalable et écrite de l'Éditeur, sollicitée par courriel à l'adresse suivante : <a href="mailto:marketing@businessprofilers.fr?subject=CGU" target="_self">marketing@businessprofilers.fr</a></p>
        <p>L'Éditeur est libre de refuser cette autorisation sans avoir à justifier de quelque manière que ce soit sa décision. Dans le cas où l'Éditeur accorderait son autorisation, celle-ci n'est dans tous les cas que temporaire et pourra être retirée à tout moment, sans obligation de justification à la charge de l'Éditeur.</p>
        <p>Dans tous les cas, tout lien devra être retiré sur simple demande de l'Éditeur.</p>
        <p>Toute information accessible via un lien vers d'autres sites n'est pas sous le contrôle de l'Éditeur qui décline toute responsabilité quant à leur contenu.</p>
    article7:
      title: "Article 7 - Protection des données personnelles"
      body: |
        <p><i><strong>Données collectées</strong></i></p>
        <p>Les données à caractère personnel qui sont collectées sur ce site sont les suivantes :</p>
        <ul>
          <li><u>Ouverture de compte</u> : lors de la création du compte de l'utilisateur : nom ; prénom ; adresse électronique ; n° de téléphone ; adresse postale ; société, photo, tva intracommunautaire ;</li>
          <li><u>Connexion</u> : lors de la connexion de l'utilisateur au site web, celui-ci enregistre, notamment, ses nom, prénom, données de connexion, d'utilisation, et de localisation</li>
          <li><u>Profil</u> : l'utilisation des prestations prévues sur le site web permet de renseigner un profil, pouvant comprendre une adresse et un numéro de téléphone ;</li>
          <li><u>Communication </u>: lorsque le site web est utilisé pour communiquer avec d'autres membres, les données concernant les communications de l'utilisateur font l'objet d'une conservation temporaire ;</li>
          <li><u>Cookies </u>: les cookies sont utilisés, dans le cadre de l'utilisation du site. L'utilisateur a la possibilité de désactiver les cookies à partir des paramètres de son navigateur.</li>
        </ul>
        <p><i><strong>Utilisation des données personnelles</strong></i></p>
        <p>Les données personnelles collectées auprès des utilisateurs ont pour objectif la mise à disposition des services du site web, leur amélioration et le maintien d'un environnement sécurisé. Plus précisément, les utilisations sont les suivantes :</p>
        <ul>
          <li>Accès et utilisation du site web par l'utilisateur ;</li>
          <li>Gestion du fonctionnement et optimisation du site web ;</li>
          <li>Organisation des conditions d'utilisation des Services commande de prestation ;</li>
          <li>Vérification, identification et authentification des données transmises par l'utilisateur ;</li>
          <li>Proposition à l'utilisateur de la possibilité de communiquer avec d'autres utilisateurs du site web ;</li>
          <li>Mise en œuvre d'une assistance utilisateurs ;</li>
          <li>Personnalisation des services en affichant des publicités en fonction de l'historique de navigation de l'utilisateur, selon ses préférences ;</li>
          <li>Prévention et détection des fraudes, malwares (malicious softwares ou logiciels malveillants) et gestion des incidents de sécurité ;</li>
          <li>Gestion des éventuels litiges avec les utilisateurs ;</li>
          <li>Envoi d'informations commerciales et publicitaires, en fonction des préférences de l'utilisateur.</li>
        </ul>
        <p><i><strong>Partage des données personnelles avec des tiers</strong></i></p>
        <p>Les données personnelles peuvent être partagées avec des sociétés tierces, dans les cas suivants :</p>
        <ul>
          <li>Lorsque l'Utilisateur utilise les services de commande, pour la mise en oeuvre de ces services, le site web est en relation avec des sociétés bancaires et financières tierces avec lesquelles elle a passé des contrats ;</li>
          <li>Lorsque l'Utilisateur publie, dans les zones de commentaires libres du site web, des informations accessibles au public ;</li>
          <li>Lorsque l'Utilisateur autorise le site web d'un tiers à accéder à ses données ;</li>
          <li>Lorsque le site web recourt aux services de prestataires pour fournir l'assistance utilisateurs et la publicité. Ces prestataires disposent d'un accès limité aux données de l'utilisateur, dans le cadre de l'exécution de ces prestations, et ont une obligation contractuelle de les utiliser en conformité avec les dispositions de la réglementation applicable en matière protection des données à caractère personnel ;</li>
          <li>Si la loi l'exige, le site web peut effectuer la transmission de données pour donner suite aux réclamations présentées contre le site web et se conformer aux procédures administratives et judiciaires ;</li>
          <li>Si le site web est impliquée dans une opération de fusion, acquisition, cession d'actifs ou procédure de redressement judiciaire, elle pourra être amenée à céder ou partager tout ou partie de ses actifs, y compris les données à caractère personnel. Dans ce cas, les utilisateurs seraient informés, avant que les données à caractère personnel ne soient transférées à une tierce partie.</li>
        </ul>
        <p><i><strong>Sécurité et confidentialité</strong></i></p>
        <p>Le site web met en œuvre des mesures organisationnelles, techniques, logicielles et physiques en matière de sécurité du numérique pour protéger les données personnelles contre les altérations, destructions et accès non autorisés. Toutefois, il est à signaler qu'internet n'est pas un environnement complètement sécurisé et le site web ne peut pas garantir la sécurité de la transmission ou du stockage des informations sur internet.</p>
        <p>Accès à l’espace client&nbsp;:</p>
        <ul>
          <li>L’utilisateur peut modifier son mot de passe à tout moment via sa page «&nbsp;mon profil&nbsp;»</li>
          <li>Il appartient à l’utilisateur d’assurer la confidentialité de ses identifiants</li>
          <li>Toute connexion à l’espace client sera présumée être effectuée par l’utilisateur lui-même</li>
          <li>L’utilisateur s’engage à ne créer qu’un seul et unique compte. L’Éditeur décline toute responsabilité quant aux conséquences dommageables que pourrait avoir l’utilisation de comptes multiples pour un seul utilisateur.</li>
          <li>L’utilisateur est entièrement responsable de l’exactitude et de la mise à jour des données communiquées dans le cadre de l’ouverture de son compte</li>
        </ul>
        <p>Refus ou suspension de l’accès à l’espace client&nbsp;:</p>
        <ul>
          <li>L’Éditeur se réserve le droit discrétionnaire de refuser l’inscription ou suspendre l’accès à l’espace client qui ne serait pas conforme à l’esprit du site ou qui contreviendrait à l’image de Business Profilers.</li>
        </ul>
        <p><i><strong>Mise en œuvre des droits des utilisateurs</strong></i></p>
        <p>En application de la réglementation applicable aux données à caractère personnel, les utilisateurs disposent des droits suivants, qu'ils peuvent exercer en faisant leur demande à l'adresse suivante : <a href="mailto:marketing@businessprofilers.fr?subject=Contact" target="_self">marketing@businessprofilers.fr</a></p>
        <p>&nbsp;</p>
        <ul>
          <li>le droit d’accès : ils peuvent exercer leur droit d'accès, pour connaître les données personnelles les concernant. Dans ce cas, avant la mise en œuvre de ce droit, le site web peut demander une preuve de l'identité de l'utilisateur afin d'en vérifier l'exactitude.</li>
          <li>le droit de rectification : si les données à caractère personnel détenues par le site web sont inexactes, ils peuvent demander la mise à jour des informations.</li>
          <li>le droit de suppression des données : les utilisateurs peuvent demander la suppression de leurs données à caractère personnel, conformément aux lois applicables en matière de protection des données.</li>
          <li>le droit à la limitation du traitement : les utilisateurs peuvent de demander au site web de limiter le traitement des données personnelles conformément aux hypothèses prévues par le RGPD.</li>
          <li>le droit de s’opposer au traitement des données : les utilisateurs peuvent s’opposer à ce que ses données soient traitées conformément aux hypothèses prévues par le RGPD.&nbsp;</li>
          <li>le droit à la portabilité : ils peuvent réclamer que le site web leur remette les données personnelles qui lui sont fournies pour les transmettre à un nouveau site web.</li>
        </ul>
        <p><i><strong>Evolution de la présente clause</strong></i></p>
        <p>Le site web se réserve le droit d'apporter toute modification à la présente clause relative à la protection des données à caractère personnel à tout moment. Si une modification est apportée à la présente clause de protection des données à caractère personnel, le site web s'engage à publier la nouvelle version sur son site. Le site web informera également les utilisateurs de la modification par messagerie électronique, dans un délai minimum de 15 jours avant la date d'effet. Si l'utilisateur n'est pas d'accord avec les termes de la nouvelle rédaction de la clause de protection des données à caractère personnel, il a la possibilité de supprimer son compte.</p>
    article8:
