      title: "1. SIMPLIFICATION & RÉACTIVITÉ"
      text: "Devis des lieux disponibles sous 48 heures ! Un expert vous est totalement dédié, car nous privilégions l'expérience humaine"
    item2:
      title: "2. EN DIRECT OU ACCOMPAGNÉ"
      text: "Vous gardez la main sur votre événement à chaque instant et décidez de notre degré implication."
    item3:
      title: "3. MEILLEURS PRIX GARANTIS"
      text: "Grâce à la puissance de notre centrale d'achat indépendante et leader sur le marché, nous négocions pour vous et vous garantissons le meilleur prix pour votre événement. Nos partenaires sont engagés contractuellement à fournir le meilleur tarif."
    item4:
      title: "4. NÉGOCIATION OPTIMALE DES CGV"
      text: "Notre expertise préserve au mieux vos intérêts. Nous vous faisons bénéficier des meilleures conditions de réservation (acompte, délai de règlement et condition d'annulation partielle ou totale)."
    item5:
      title: "5. UNE FIDÉLITÉ PRATIQUE"
      text: "Lorsqu'un Grand Merci ne suffit pas : nous vous proposons de découvrir la richesse de l'offre séminaire en France et à l'étranger par des séjours de repérage éducationnels."
    item6:
      title: "6. PRESTATION SANS FRAIS D'AGENCE"
      text: "Cette prestation vous est fournie sans frais d'agence, ni honoraires. À l'origine une association, la transparence est le pilier de notre ADN."
    item7:
      title: "7. COMPTE FOURNISSEUR UNIQUE"
      text: "En nous mandatant pour l'achat, vous économisez des démarches administratives coûteuses. Une seule facture par événement, peu importe le nombre de prestataires."
    item8:
      title: "8. FINANCEMENT DE VOTRE ÉVÉNEMENT"
      text: "Nous avançons pour vous les acomptes et les arrhes auprès des fournisseurs selon les accords d'un contrat cadre. La facture finale post événement est à régler selon nos accords."
    item9:
      title: "9. RÉCUPÉRATION DE TVA"
      text: "En nous confiant l'achat de vos événements, vous transférez par délégation de mandat de mission à Business Profilers. Vous pouvez donc récupérer la TVA sur chaque événement."
    item10:
      title: "10. TABLEAU DE BORD PERSONNALISÉ"
      text: "Notre outil de reporting est le summum de ce qu'un acheteur peut attendre ! Entièrement personnalisable : remonter d'information en directe, notifications, alertes, graphiques, exports automatiques et workflows personnalisés… Décrivez-nous votre rêve et nous le ferons !"
    item11:
      title: "11. REMISE DE FIN D'ANNÉE"
      text: "Nous vous offrons une remise supplémentaire sur vos dépenses événementielles."
    item12:
      title: "12. PRISE EN CHARGE DE VOS REPÉRAGES"
      text: "Nous organisons pour vous, vos repérages et prénons en charge les frais d'hébergement."
