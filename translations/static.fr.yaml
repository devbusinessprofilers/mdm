  team:
    breadcrumb: "L'équipe"
  solution:
    subtitle: "Optimisez vos événements et piloter vos dépenses événementielles"
    intro: "Grâce à notre solution unique, nous simplifions la réservation de lieux pour vos événements professionnels, tout en vous permettant de maîtriser vos dépenses. Notre technologie disruptive s'adapte à toutes les organisations et nous permet d'accompagner les organisateurs pour des événements clé en main, en leur laissant le choix de notre degré d'implication."
