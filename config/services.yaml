# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(AUDIT_ENABLED): '1'
    env(TEST_MESSENGER_PIM_DSN): 'in-memory://?serialize=true'
    env(EXTERNAL_SITE_JWT_ISSUER): 'external-site'
    env(EXTERNAL_SITE_JWT_AUDIENCE): 'mdm'
    env(EXTERNAL_SITE_JWT_SUBJECT): 'external-site'
    env(EXTERNAL_SITE_JWT_PUBLIC_KEY): ''
    env(S3_ACCESS_KEY): ''
    env(S3_SECRET_KEY): ''
    env(MAILER_FROM): 'noreply@businessprofilers.fr'
    env(INVITATION_SIGNING_KEY): ''
    env(GOOGLE_TRANSLATE_API_KEY): ''
    env(GOOGLE_TRANSLATE_ENDPOINT): 'https://translation.googleapis.com/language/translate/v2'
    env(BOX_OCR_ENABLED): '0'
    env(OCR_AUTO_APPLY_THRESHOLD): '0'
    env(BOX_CLIENT_ID): ''
    env(BOX_CLIENT_SECRET): ''
    env(BOX_SUBJECT_TYPE): 'enterprise'
    env(BOX_SUBJECT_ID): ''
    env(BOX_FOLDER_ID): '0'
    env(BOX_API_URL): 'https://api.box.com'
    env(BOX_UPLOAD_URL): 'https://upload.box.com/api'
    env(BOX_ENHANCED_EXTRACT_AGENT): 'enhanced_extract_agent'
    env(OPENAI_ENABLED): '0'
    env(OPENAI_API_KEY): ''
    env(OPENAI_API_URL): 'https://api.openai.com'
    env(OPENAI_IMAGE_EDIT_MODEL): 'gpt-image-1'
    env(OPENAI_VISION_MODEL): 'gpt-4o'
    env(OPENAI_RETOUCHE_PROMPT): 'Améliore la luminosité, le contraste, les couleurs et la netteté de cette photo sans modifier son contenu, son cadrage ni les éléments présents.'
    env(OPENAI_RECO_PROMPT): 'Décris cette photo d’un établissement événementiel en français : une légende d’une phrase, des mots-clés, le type de vue, intérieur ou extérieur.'
    env(OPENAI_RECO_AUTO_ENABLED): '1'
    env(OPENAI_SUGGESTION_MODEL): 'gpt-4o'
    env(OPENAI_SUGGESTION_PROMPT): "Tu es un rédacteur pour un référentiel d’établissements événementiels.\nAméliore ou propose le champ « {champ} » de la fiche décrite ci-dessous.\nRéponds uniquement par le texte du champ, en français, sans commentaire ni guillemets.\n\nContexte de la fiche :\n{contexte}\n\nContenu actuel du champ :\n{valeur}"
    env(DAM_PHASH_DISTANCE_THRESHOLD): '8'
    env(PIM_TEXT_SIMHASH_DISTANCE_THRESHOLD): '10'
    env(PIM_TEXT_MIN_LENGTH): '60'
    env(COMPLETENESS_REMINDER_THRESHOLD): '60'
    env(COMPLETENESS_REMINDER_COOLDOWN_DAYS): '30'
    env(COMPLETENESS_REMINDER_ENABLED): '1'
    env(RECHERCHE_ENTREPRISES_ENDPOINT): 'https://recherche-entreprises.api.gouv.fr'
    env(SIRENE_STATUS_CHECK_ENABLED): '0'
    env(SIRENE_RESCAN_AFTER_DAYS): '180'
    env(GEOAPIFY_RESCAN_AFTER_DAYS): '180'
    env(DATATOURISME_RESCAN_AFTER_DAYS): '180'
    env(WIKIDATA_RESCAN_AFTER_DAYS): '180'
    env(GEOAPIFY_PLACES_ENABLED): '0'
    env(DATATOURISME_ENABLED): '0'
    env(DATATOURISME_FLUX_DIR): ''
    env(WIKIDATA_CHAINE_ENABLED): '0'
    env(WIKIDATA_SPARQL_ENDPOINT): 'https://query.wikidata.org/sparql'
    env(BAN_API_ENDPOINT): 'https://api-adresse.data.gouv.fr'
    env(GEOAPIFY_API_ENDPOINT): 'https://api.geoapify.com'
    env(GEOAPIFY_API_KEY): ''
    env(MARKETPLACE_SYNC_API_URL): ''
    env(MARKETPLACE_SYNC_API_LOGIN): ''
    env(MARKETPLACE_SYNC_API_PASSWORD): ''
    env(SALESFORCE_LOGIN_URL): ''
    env(SALESFORCE_CLIENT_ID): ''
    env(SALESFORCE_USERNAME): ''
    env(SALESFORCE_PRIVATE_KEY): ''
    # Synchro Salesforce par CSV e-mail (système de transition, désactivé par
    # défaut). Vide/0 = rien n'est envoyé (dev, test, avant le « go » migration).
    env(SALESFORCE_CSV_ENABLED): '0'
    env(SALESFORCE_CSV_TO): ''
    env(SALESFORCE_CSV_FROM): '%env(MAILER_FROM)%'
    # Secret (autorise l'injection de CSV dans Salesforce) : posé hors dépôt.
    env(SALESFORCE_CSV_INTEGRATION_TOKEN): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Sessions en base (table `sessions`) : le handler ouvre sa propre connexion
    # PDO paresseuse, indépendante de la connexion Doctrine et de ses transactions.
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'

    App\Shared\Outbox\OutboxPublisher:
        arguments:
            $serializer: '@messenger.transport.symfony_serializer'
            $sendersLocator: '@messenger.senders_locator'

    App\Shared\Outbox\OutboxRelay:
        arguments:
            $serializer: '@messenger.transport.symfony_serializer'

    App\Pim\Completeness\CompletenessMediaAssetLookupInterface: '@App\Pim\Completeness\DoctrineCompletenessMediaAssetLookup'

    App\DataFixtures\Pim\LieuFixtures:
        arguments:
            $debugDataHolder: '@?doctrine.debug_data_holder'

    App\DataFixtures\Pim\ActiviteFixtures:
        arguments:
            $debugDataHolder: '@?doctrine.debug_data_holder'

    App\DataFixtures\Pim\ServiceFixtures:
        arguments:
            $debugDataHolder: '@?doctrine.debug_data_holder'

    App\Account\Security\ExternalSiteJwtVerifier:
        arguments:
            $issuer: '%env(EXTERNAL_SITE_JWT_ISSUER)%'
            $audience: '%env(EXTERNAL_SITE_JWT_AUDIENCE)%'
            $subject: '%env(EXTERNAL_SITE_JWT_SUBJECT)%'
            $publicKey: '%env(EXTERNAL_SITE_JWT_PUBLIC_KEY)%'

    App\Account\Service\InvitationTokenSigner:
        arguments:
            $key: '%env(INVITATION_SIGNING_KEY)%'

    App\Account\Service\PasswordResetTokenSigner:
        arguments:
            $key: '%env(INVITATION_SIGNING_KEY)%'

    App\Account\MessageHandler\InternalUserInvitedHandler:
        arguments:
            $sender: '%env(MAILER_FROM)%'

    App\Account\MessageHandler\InternalUserPasswordResetRequestedHandler:
        arguments:
            $sender: '%env(MAILER_FROM)%'

    App\Shared\Service\SignalementBugMailer:
        arguments:
            $sender: '%env(MAILER_FROM)%'
            $destinataire: 'theofane@businessprofilers.fr'

    # L'invitation d'un collaborateur est poussée vers la marketplace, qui crée
    # le compte et envoie l'email. URL vide = envoi journalisé et ignoré (dev).
    App\Account\Service\MarketplaceCollaborateurGatewayInterface: '@App\Account\Service\MarketplaceHttpGateway'

    App\Account\Service\MarketplaceHttpGateway:
        arguments:
            $endpoint: '%env(MARKETPLACE_API_URL)%'
            $token: '%env(MARKETPLACE_API_TOKEN)%'

    # Synchronisation des fiches vers la marketplace (compte machine ROLE_PIM,
    # JWT Lexik). URL vide = diffusion désactivée pour l'environnement.
    App\Etl\Service\MarketplaceClientInterface: '@App\Etl\Service\MarketplaceApiClient'

    App\Etl\Service\MarketplaceApiClient:
        arguments:
            $endpoint: '%env(MARKETPLACE_SYNC_API_URL)%'
            $login: '%env(MARKETPLACE_SYNC_API_LOGIN)%'
            $password: '%env(MARKETPLACE_SYNC_API_PASSWORD)%'

    # Lecture Salesforce (refresh des données fiche : RSE, évaluation,
    # procédure judiciaire, contrats, partenaire). Vide = désactivé.
    App\Etl\Service\SalesforceClientInterface: '@App\Etl\Service\SalesforceApiClient'

    App\Etl\Service\SalesforceApiClient:
        arguments:
            $loginUrl: '%env(SALESFORCE_LOGIN_URL)%'
            $clientId: '%env(SALESFORCE_CLIENT_ID)%'
            $username: '%env(SALESFORCE_USERNAME)%'
            $privateKey: '%env(SALESFORCE_PRIVATE_KEY)%'

    # Écriture Salesforce (CSV e-mail, système de transition). Expéditeur par
    # défaut = MAILER_FROM ; l'activation, le destinataire et le jeton
    # d'intégration se règlent dans /admin/parametres.
    App\Etl\Service\SalesforceCsvSettings:
        arguments:
            # Repli garanti non vide : SALESFORCE_CSV_FROM peut être vide
            # (surcharge explicite), MAILER_FROM a toujours une valeur.
            $expediteurParDefaut: '%env(MAILER_FROM)%'

    App\Pim\Service\RechercheEntrepriseClient:
        arguments:
            $endpoint: '%env(RECHERCHE_ENTREPRISES_ENDPOINT)%'

    # Vérification des adresses françaises (Base Adresse Nationale,
    # gratuite et sans clé). Vide = vérification désactivée.
    App\Pim\Service\BanClientInterface: '@App\Pim\Service\BanApiClient'

    App\Pim\Service\BanApiClient:
        arguments:
            $endpoint: '%env(BAN_API_ENDPOINT)%'

    # Vérification des adresses étrangères (Geoapify, données OpenStreetMap).
    # Clé absente = vérification étrangère désactivée, la France continue.
    App\Pim\Service\GeocodeurEtrangerInterface: '@App\Pim\Service\GeoapifyClient'

    App\Pim\Service\GeoapifyClient:
        arguments:
            $endpoint: '%env(GEOAPIFY_API_ENDPOINT)%'
            $apiKey: '%env(GEOAPIFY_API_KEY)%'

    App\Shared\Service\OvhS3ObjectStorage:
        factory: ['App\Shared\Service\OvhS3ObjectStorage', 'create']
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $region: '%env(S3_REGION)%'
            $bucket: '%env(S3_PRIVATE_BUCKET)%'
            $accessKey: '%env(S3_ACCESS_KEY)%'
            $secretKey: '%env(S3_SECRET_KEY)%'

    app.storage.public:
        class: App\Shared\Service\OvhS3ObjectStorage
        factory: ['App\Shared\Service\OvhS3ObjectStorage', 'create']
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $region: '%env(S3_REGION)%'
            $bucket: '%env(S3_PUBLIC_BUCKET)%'
            $accessKey: '%env(S3_ACCESS_KEY)%'
            $secretKey: '%env(S3_SECRET_KEY)%'

    App\Shared\Service\ObjectStorageInterface: '@App\Shared\Service\OvhS3ObjectStorage'
    App\Shared\Service\PrivateObjectStorageInterface: '@App\Shared\Service\OvhS3ObjectStorage'
    App\Shared\Service\PublicObjectStorageInterface: '@app.storage.public'

    App\Dam\Service\LieuImageUploader:
        arguments:
            $storagePrefix: '%env(S3_PREFIX)%'

    App\Dam\Service\FicheImageUploader:
        arguments:
            $storagePrefix: '%env(S3_PREFIX)%'

    App\Dam\Service\FicheDocumentUploader:
        arguments:
            $storagePrefix: '%env(S3_PREFIX)%'

    App\Dam\Service\LieuDocumentUploader:
        arguments:
            $storagePrefix: '%env(S3_PREFIX)%'

    App\Dam\Service\PublicMediaUrlGenerator:
        arguments:
            $baseUrl: '%env(S3_PUBLIC_BASE_URL)%'

    App\Enrichment\Service\GoogleTranslationProvider:
        arguments:
            $apiKey: '%env(GOOGLE_TRANSLATE_API_KEY)%'
            $endpoint: '%env(GOOGLE_TRANSLATE_ENDPOINT)%'

    App\Enrichment\Service\TranslationProviderInterface: '@App\Enrichment\Service\GoogleTranslationProvider'

    App\Ocr\Service\BoxExtractProvider:
        arguments:
            $clientId: '%env(BOX_CLIENT_ID)%'
            $clientSecret: '%env(BOX_CLIENT_SECRET)%'
            $subjectType: '%env(BOX_SUBJECT_TYPE)%'
            $subjectId: '%env(BOX_SUBJECT_ID)%'
            $folderId: '%env(BOX_FOLDER_ID)%'
            $apiUrl: '%env(BOX_API_URL)%'
            $uploadUrl: '%env(BOX_UPLOAD_URL)%'
            $agent: '%env(BOX_ENHANCED_EXTRACT_AGENT)%'

    App\Ocr\Service\DocumentExtractionProviderInterface: '@App\Ocr\Service\BoxExtractProvider'

    App\Vision\Service\OpenAiImageProvider:
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
            $apiUrl: '%env(OPENAI_API_URL)%'

    App\Vision\Service\ImageEnhancementProviderInterface: '@App\Vision\Service\OpenAiImageProvider'
    App\Vision\Service\ImageRecognitionProviderInterface: '@App\Vision\Service\OpenAiImageProvider'

    App\Vision\Service\OpenAiTextProvider:
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
            $apiUrl: '%env(OPENAI_API_URL)%'

    App\Vision\Service\TextSuggestionProviderInterface: '@App\Vision\Service\OpenAiTextProvider'

    # Paramètres applicatifs modifiables dans /admin : la variable d'env reste
    # la valeur par défaut, la table `parametre` la surcharge à chaud.
    App\Shared\Service\ParametreProviderInterface: '@App\Shared\Service\ParametreProvider'

    App\Shared\Service\ParametreProvider:
        arguments:
            $defauts:
                alerte.email: '%env(ALERT_EMAIL_TO)%'
                alerte.seuil_file_echec: '%env(ALERT_FAILED_QUEUE_THRESHOLD)%'
                box.ocr_active: '%env(BOX_OCR_ENABLED)%'
                completude.delai_rappel_jours: '%env(COMPLETENESS_REMINDER_COOLDOWN_DAYS)%'
                completude.rappel_auto_actif: '%env(COMPLETENESS_REMINDER_ENABLED)%'
                completude.seuil_rappel: '%env(COMPLETENESS_REMINDER_THRESHOLD)%'
                compte.invitation_validite_heures: '%env(ACCOUNT_INVITATION_VALIDITY_HOURS)%'
                compte.max_destinataires_demandes: '%env(ACCOUNT_MAX_REQUEST_RECIPIENTS)%'
                compte.mot_de_passe_longueur_min: '%env(ACCOUNT_PASSWORD_MIN_LENGTH)%'
                compte.purge_jetons_jours: '%env(ACCOUNT_TOKEN_PURGE_DAYS)%'
                compte.reset_validite_heures: '%env(ACCOUNT_RESET_VALIDITY_HOURS)%'
                dam.delai_alerte_droits_jours: '%env(DAM_RIGHTS_ALERT_DAYS)%'
                dam.document_poids_max_mo: '%env(DAM_DOCUMENT_MAX_MB)%'
                dam.image_hauteur_min: '%env(DAM_IMAGE_MIN_HEIGHT)%'
                dam.image_largeur_min: '%env(DAM_IMAGE_MIN_WIDTH)%'
                dam.image_poids_max_mo: '%env(DAM_IMAGE_MAX_MB)%'
                dam.seuil_distance_phash: '%env(DAM_PHASH_DISTANCE_THRESHOLD)%'
                dam.support_commercial_poids_max_mo: '%env(DAM_COMMERCIAL_SUPPORT_MAX_MB)%'
                ocr.pdf_pages_max: '%env(OCR_PDF_MAX_PAGES)%'
                openai.actif: '%env(OPENAI_ENABLED)%'
                openai.reco_auto_active: '%env(OPENAI_RECO_AUTO_ENABLED)%'
                openai.reco_modele: '%env(OPENAI_VISION_MODEL)%'
                openai.reco_prompt: '%env(OPENAI_RECO_PROMPT)%'
                openai.retouche_modele: '%env(OPENAI_IMAGE_EDIT_MODEL)%'
                openai.retouche_prompt: '%env(OPENAI_RETOUCHE_PROMPT)%'
                openai.suggestion_modele: '%env(OPENAI_SUGGESTION_MODEL)%'
                openai.suggestion_prompt: '%env(OPENAI_SUGGESTION_PROMPT)%'
                openai.atouts_prompt: '%env(OPENAI_ATOUTS_PROMPT)%'
                ocr.pdf_poids_max_mo: '%env(OCR_PDF_MAX_MB)%'
                ocr.seuil_application_auto: '%env(OCR_AUTO_APPLY_THRESHOLD)%'
                pim.longueur_min_texte_doublon: '%env(PIM_TEXT_MIN_LENGTH)%'
                pim.seuil_distance_simhash: '%env(PIM_TEXT_SIMHASH_DISTANCE_THRESHOLD)%'
                photos.max_autres: '%env(PHOTOS_MAX_AUTRES)%'
                photos.max_lieu: '%env(PHOTOS_MAX_LIEU)%'
                photos.min_autres: '%env(PHOTOS_MIN_AUTRES)%'
                photos.min_lieu: '%env(PHOTOS_MIN_LIEU)%'
                salesforce.csv_actif: '%env(SALESFORCE_CSV_ENABLED)%'
                salesforce.csv_destinataire: '%env(SALESFORCE_CSV_TO)%'
                salesforce.csv_expediteur: '%env(SALESFORCE_CSV_FROM)%'
                salesforce.csv_token: '%env(SALESFORCE_CSV_INTEGRATION_TOKEN)%'
                sirene.verif_statut_actif: '%env(SIRENE_STATUS_CHECK_ENABLED)%'
                sirene.rescan_apres_jours: '%env(SIRENE_RESCAN_AFTER_DAYS)%'
                geoapify.enrichissement_places: '%env(GEOAPIFY_PLACES_ENABLED)%'
                geoapify.rescan_apres_jours: '%env(GEOAPIFY_RESCAN_AFTER_DAYS)%'
                datatourisme.import_actif: '%env(DATATOURISME_ENABLED)%'
                datatourisme.rescan_apres_jours: '%env(DATATOURISME_RESCAN_AFTER_DAYS)%'
                wikidata.detection_chaine: '%env(WIKIDATA_CHAINE_ENABLED)%'
                wikidata.rescan_apres_jours: '%env(WIKIDATA_RESCAN_AFTER_DAYS)%'

    App\Pim\Service\DataTourisme\DataTourismeFluxReader:
        arguments:
            $fluxDir: '%env(DATATOURISME_FLUX_DIR)%'

    App\Pim\Service\Wikidata\WikidataChaineClient:
        arguments:
            $endpoint: '%env(WIKIDATA_SPARQL_ENDPOINT)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Etl\Service\FicheImportJobManager:
        arguments:
            $importDir: '%kernel.project_dir%/var/import'

    App\Etl\MessageHandler\StartFicheImportHandler:
        arguments:
            $importDir: '%kernel.project_dir%/var/import'

    App\Etl\MessageHandler\ProcessFicheImportBatchHandler:
        arguments:
            $importDir: '%kernel.project_dir%/var/import'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Aucun appel réseau en test : le mock renvoie une réponse vide que le
        # client absorbe (pas d'enrichissement).
        test.recherche_entreprises.mock_http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true

        App\Pim\Service\RechercheEntrepriseClient:
            arguments:
                $httpClient: '@test.recherche_entreprises.mock_http_client'
                $endpoint: 'https://recherche-entreprises.invalid'
