# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(AUDIT_ENABLED): '1'
    env(TEST_MESSENGER_PIM_DSN): 'in-memory://?serialize=true'
    env(EXTERNAL_SITE_JWT_ISSUER): 'external-site'
    env(EXTERNAL_SITE_JWT_AUDIENCE): 'mdm'
    env(EXTERNAL_SITE_JWT_SUBJECT): 'external-site'
    env(EXTERNAL_SITE_JWT_PUBLIC_KEY): ''
    env(S3_ACCESS_KEY): ''
    env(S3_SECRET_KEY): ''
    env(MAILER_FROM): 'noreply@businessprofilers.fr'
    env(INVITATION_SIGNING_KEY): ''
    env(GOOGLE_TRANSLATE_API_KEY): ''
    env(GOOGLE_TRANSLATE_ENDPOINT): 'https://translation.googleapis.com/language/translate/v2'
    env(BOX_OCR_ENABLED): '0'
    env(BOX_CLIENT_ID): ''
    env(BOX_CLIENT_SECRET): ''
    env(BOX_SUBJECT_TYPE): 'enterprise'
    env(BOX_SUBJECT_ID): ''
    env(BOX_FOLDER_ID): '0'
    env(BOX_API_URL): 'https://api.box.com'
    env(BOX_UPLOAD_URL): 'https://upload.box.com/api'
    env(BOX_ENHANCED_EXTRACT_AGENT): 'enhanced_extract_agent'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Shared\Outbox\OutboxPublisher:
        arguments:
            $serializer: '@messenger.transport.symfony_serializer'
            $sendersLocator: '@messenger.senders_locator'

    App\Shared\Outbox\OutboxRelay:
        arguments:
            $serializer: '@messenger.transport.symfony_serializer'

    App\Pim\Completeness\CompletenessMediaAssetLookupInterface: '@App\Pim\Completeness\DoctrineCompletenessMediaAssetLookup'

    App\DataFixtures\Pim\LieuFixtures:
        arguments:
            $debugDataHolder: '@?doctrine.debug_data_holder'

    App\DataFixtures\Pim\ActiviteFixtures:
        arguments:
            $debugDataHolder: '@?doctrine.debug_data_holder'

    App\DataFixtures\Pim\ServiceFixtures:
        arguments:
            $debugDataHolder: '@?doctrine.debug_data_holder'

    App\Account\Security\ExternalSiteJwtVerifier:
        arguments:
            $issuer: '%env(EXTERNAL_SITE_JWT_ISSUER)%'
            $audience: '%env(EXTERNAL_SITE_JWT_AUDIENCE)%'
            $subject: '%env(EXTERNAL_SITE_JWT_SUBJECT)%'
            $publicKey: '%env(EXTERNAL_SITE_JWT_PUBLIC_KEY)%'

    App\Account\Service\InvitationTokenSigner:
        arguments:
            $key: '%env(INVITATION_SIGNING_KEY)%'

    App\Account\Service\PasswordResetTokenSigner:
        arguments:
            $key: '%env(INVITATION_SIGNING_KEY)%'

    App\Account\MessageHandler\InternalUserInvitedHandler:
        arguments:
            $sender: '%env(MAILER_FROM)%'

    App\Account\MessageHandler\InternalUserPasswordResetRequestedHandler:
        arguments:
            $sender: '%env(MAILER_FROM)%'

    App\Shared\Service\OvhS3ObjectStorage:
        factory: ['App\Shared\Service\OvhS3ObjectStorage', 'create']
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $region: '%env(S3_REGION)%'
            $bucket: '%env(S3_PRIVATE_BUCKET)%'
            $accessKey: '%env(S3_ACCESS_KEY)%'
            $secretKey: '%env(S3_SECRET_KEY)%'

    app.storage.public:
        class: App\Shared\Service\OvhS3ObjectStorage
        factory: ['App\Shared\Service\OvhS3ObjectStorage', 'create']
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $region: '%env(S3_REGION)%'
            $bucket: '%env(S3_PUBLIC_BUCKET)%'
            $accessKey: '%env(S3_ACCESS_KEY)%'
            $secretKey: '%env(S3_SECRET_KEY)%'

    App\Shared\Service\ObjectStorageInterface: '@App\Shared\Service\OvhS3ObjectStorage'
    App\Shared\Service\PrivateObjectStorageInterface: '@App\Shared\Service\OvhS3ObjectStorage'
    App\Shared\Service\PublicObjectStorageInterface: '@app.storage.public'

    App\Dam\Service\LieuImageUploader:
        arguments:
            $storagePrefix: '%env(S3_PREFIX)%'

    App\Dam\Service\FicheImageUploader:
        arguments:
            $storagePrefix: '%env(S3_PREFIX)%'

    App\Dam\Service\FicheDocumentUploader:
        arguments:
            $storagePrefix: '%env(S3_PREFIX)%'

    App\Dam\Service\LieuDocumentUploader:
        arguments:
            $storagePrefix: '%env(S3_PREFIX)%'

    App\Dam\Service\PublicMediaUrlGenerator:
        arguments:
            $baseUrl: '%env(S3_PUBLIC_BASE_URL)%'

    App\Enrichment\Service\GoogleTranslationProvider:
        arguments:
            $apiKey: '%env(GOOGLE_TRANSLATE_API_KEY)%'
            $endpoint: '%env(GOOGLE_TRANSLATE_ENDPOINT)%'

    App\Enrichment\Service\TranslationProviderInterface: '@App\Enrichment\Service\GoogleTranslationProvider'

    App\Ocr\Service\BoxExtractProvider:
        arguments:
            $clientId: '%env(BOX_CLIENT_ID)%'
            $clientSecret: '%env(BOX_CLIENT_SECRET)%'
            $subjectType: '%env(BOX_SUBJECT_TYPE)%'
            $subjectId: '%env(BOX_SUBJECT_ID)%'
            $folderId: '%env(BOX_FOLDER_ID)%'
            $apiUrl: '%env(BOX_API_URL)%'
            $uploadUrl: '%env(BOX_UPLOAD_URL)%'
            $agent: '%env(BOX_ENHANCED_EXTRACT_AGENT)%'

    App\Ocr\Service\DocumentExtractionProviderInterface: '@App\Ocr\Service\BoxExtractProvider'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Etl\Service\FicheImportJobManager:
        arguments:
            $importDir: '%kernel.project_dir%/var/import'

    App\Etl\MessageHandler\StartFicheImportHandler:
        arguments:
            $importDir: '%kernel.project_dir%/var/import'

    App\Etl\MessageHandler\ProcessFicheImportBatchHandler:
        arguments:
            $importDir: '%kernel.project_dir%/var/import'
