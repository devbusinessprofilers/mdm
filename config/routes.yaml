# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

shared_controllers:
    resource: '../src/Shared/Controller/'
    type: attribute

pim_controllers:
    resource: '../src/Pim/Controller/'
    type: attribute

dam_controllers:
    resource: '../src/Dam/Controller/'
    type: attribute

etl_controllers:
    resource: '../src/Etl/Controller/'
    type: attribute

enrichment_controllers:
    resource: '../src/Enrichment/Controller/'
    type: attribute

ocr_controllers:
    resource: '../src/Ocr/Controller/'
    type: attribute

account_controllers:
    resource: '../src/Account/Controller/'
    type: attribute

audit_controllers:
    resource: '../src/Audit/Controller/'
    type: attribute

dashboard_controllers:
    resource: '../src/Dashboard/Controller/'
    type: attribute

# La création de fiche est aussi servie à l'emplacement prévu par la maquette
# front (test-integration) : même contrôleur, même formulaire.
app_mdm_creation_fiche:
    path: /referentiel/fiche/nouvelle
    controller: App\Pim\Controller\FicheController::new
    methods: [GET, POST]

# L'ancien nom de route de l'accueil reste servi : la racine est désormais le
# tableau de bord MDM.
app_pim_home:
    alias: app_mdm_tableau_de_bord

# Nom historique de la création de fiche (les anciens liens/redirects restent valides).
app_pim_fiche_new:
    alias: app_mdm_creation_fiche
