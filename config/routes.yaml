# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

shared_controllers:
    resource: '../src/Shared/Controller/'
    type: attribute

pim_controllers:
    resource: '../src/Pim/Controller/'
    type: attribute

dam_controllers:
    resource: '../src/Dam/Controller/'
    type: attribute

etl_controllers:
    resource: '../src/Etl/Controller/'
    type: attribute

enrichment_controllers:
    resource: '../src/Enrichment/Controller/'
    type: attribute

account_controllers:
    resource: '../src/Account/Controller/'
    type: attribute

# ---------------------------------------------------------------------------
# Alias attendus par les composants importés du portail prestataire
# ---------------------------------------------------------------------------
# Les gabarits de `templates/pim/components/` engendrent des URL par nom de
# route : `Header:Profil` pointe sur la fiche de compte, `Logo` sur l'accueil.
# Ces noms n'existent pas ici. Plutôt que de retoucher des composants qu'on veut
# pouvoir retransplanter tels quels, on déclare les alias vers les écrans
# correspondants du back-office.
#
# À remplacer par les vraies routes au fil des intégrations.
provider_portal_account_personal_information:
    alias: app_mdm_espace_travail

provider_portal_index:
    alias: app_mdm_tableau_de_bord
