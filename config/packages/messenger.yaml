framework:
    messenger:
        failure_transport: failed

        serializer:
            default_serializer: messenger.transport.symfony_serializer
            symfony_serializer:
                format: json

        transports:
            pim:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: pim
                    redeliver_timeout: 900
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
            dam:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: dam
                    redeliver_timeout: 900
                retry_strategy:
                    max_retries: 5
                    delay: 5000
                    multiplier: 2
                    max_delay: 60000
            etl:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: etl
                    redeliver_timeout: 900
                retry_strategy:
                    max_retries: 5
                    delay: 10000
                    multiplier: 2
                    max_delay: 60000
            enrichment:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: enrichment
                    redeliver_timeout: 900
                retry_strategy:
                    max_retries: 5
                    delay: 10000
                    multiplier: 2
                    max_delay: 60000
            completeness:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: completeness
                    redeliver_timeout: 900
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
            mail:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: mail
                    redeliver_timeout: 900
                retry_strategy:
                    max_retries: 5
                    delay: 10000
                    multiplier: 2
                    max_delay: 60000
            # Diffusion vers la marketplace : transport dédié pour qu'une
            # indisponibilité de la marketplace ne bloque pas la file pim.
            marketplace:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: marketplace
                    redeliver_timeout: 900
                retry_strategy:
                    max_retries: 5
                    delay: 10000
                    multiplier: 2
                    max_delay: 60000
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: failed

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - App\Shared\Outbox\ReceivedDoctrineTransactionMiddleware
                    - App\Shared\Outbox\IdempotencyMiddleware

        routing:
            'App\Account\Message\*': mail
            App\Shared\Message\MediaUploaded: dam
            App\Shared\Message\MediaProcessed: pim
            App\Pim\Message\CalculateFicheCompleteness: completeness
            App\Pim\Message\RecalculateCompletenessBatch: completeness
            # Avant le joker Pim : les relances partent par le worker mail.
            App\Pim\Message\EnvoyerRelancePlanifiee: mail
            # Avant le joker Pim : le scan multi-sources + IA du bouton
            # « Enrichir ce qui manque » est long (flux DATAtourisme, OpenAI),
            # il ne doit pas bloquer la file pim (indexation, workflow).
            App\Pim\Message\EnrichirFiche: enrichment
            # Avant le joker Pim : la génération d'un export Excel peut durer
            # (tout le référentiel), elle part sur la file batch etl.
            App\Pim\Message\GenererReferentielExport: etl
            'App\Pim\Message\*': pim
            'App\Dashboard\Message\*': pim
            'App\Dam\Message\*': dam
            # Avant le joker Etl : la diffusion marketplace a son transport
            # dédié pour qu'une indisponibilité ne bloque pas la file etl.
            App\Etl\Message\SyncFicheMarketplace: marketplace
            App\Etl\Message\RemoveFicheFromMarketplace: marketplace
            App\Etl\Message\PruneMarketplacePhotos: marketplace
            App\Etl\Message\SyncLovDictionary: marketplace
            'App\Etl\Message\*': etl
            'App\Enrichment\Message\*': enrichment
            'App\Ocr\Message\*': enrichment
            # Avant le joker Vision : la régénération d'images est le métier
            # du worker dam, les appels IA longs restent sur enrichment.
            App\Vision\Message\ApplyImageEnhancement: dam
            'App\Vision\Message\*': enrichment
            Symfony\Component\Notifier\Message\ChatMessage: mail
            Symfony\Component\Notifier\Message\SmsMessage: mail

when@test:
    framework:
        messenger:
            transports:
                pim:
                    dsn: '%env(TEST_MESSENGER_PIM_DSN)%'
                dam:
                    dsn: 'in-memory://'
                    options: { serialize: true }
                etl:
                    dsn: 'in-memory://'
                    options: { serialize: true }
                enrichment:
                    dsn: 'in-memory://'
                    options: { serialize: true }
                completeness:
                    dsn: 'in-memory://'
                    options: { serialize: true }
                mail:
                    dsn: 'in-memory://'
                    options: { serialize: true }
                marketplace:
                    dsn: 'in-memory://'
                    options: { serialize: true }
                failed:
                    dsn: 'in-memory://'
                    options: { serialize: true }
