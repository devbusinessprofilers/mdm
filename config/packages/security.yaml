security:
    role_hierarchy:
        ROLE_BP_EDITOR: ROLE_USER
        ROLE_BP_VALIDATOR: ROLE_BP_EDITOR
        ROLE_ADMIN: [ROLE_BP_VALIDATOR, ROLE_ALLOWED_TO_SWITCH]
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Account\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        external_api:
            pattern: ^/api/v1/(?:lieux|activites|services|restaurants)
            stateless: true
            custom_authenticators:
                - App\Account\Security\ExternalSiteJwtAuthenticator
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Account\Security\ActiveUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: app_pim_home
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                csrf_token_id: logout

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        # Protégé par jeton Bearer dans MetricsController (404 sans jeton valide).
        - { path: ^/metrics$, roles: PUBLIC_ACCESS }
        - { path: ^/connexion$, roles: PUBLIC_ACCESS }
        # Ancien chemin de connexion : simple redirection publique vers /connexion.
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/invitation/, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe-oublie$, roles: PUBLIC_ACCESS }
        - { path: ^/reinitialiser-mot-de-passe/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/(?:lieux|activites|services|restaurants), roles: ROLE_EXTERNAL_SITE }
        - { path: ^/admin, roles: ROLE_BP_EDITOR }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
