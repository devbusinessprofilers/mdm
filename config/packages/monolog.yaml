monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Channels métier (persistés dès info en BDD par le handler db, cf.
        # DoctrineDbalLogHandler::INFO_CHANNELS) — branchés sur les services
        # via #[WithMonologChannel('...')].
        - enrichment
        - marketplace_sync
        - salesforce
        - vision
        - mail
        - audit

when@dev:
    monolog:
        handlers:
            main:
                # Rotation quotidienne (dev-YYYY-MM-DD.log) : le stream sans
                # rotation avait laissé dev.log grossir à 5,6 Go.
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 7
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            # Visionneuse /admin/performance : warning+ global, info+ sur les
            # channels métier (filtre porté par le handler). "!doctrine" est la
            # première garde anti-boucle (une erreur SQL ne repasse pas par la BDD).
            db:
                type: service
                id: App\Shared\Monolog\DoctrineDbalLogHandler
                channels: ["!event", "!doctrine", "!deprecation"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Même visionneuse qu'en dev : sur Upsun les fichiers n'existent
            # pas, la BDD est le seul canal que l'application peut relire.
            db:
                type: service
                id: App\Shared\Monolog\DoctrineDbalLogHandler
                channels: ["!event", "!doctrine", "!deprecation"]
