doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        schema_filter: '~^(?!(messenger_messages|pim_fiche_code_counter|dam_media_phash_band|sessions)$)~'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            Pim:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Pim/Entity'
                prefix: 'App\Pim\Entity'
                alias: Pim
            Dam:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Dam/Entity'
                prefix: 'App\Dam\Entity'
                alias: Dam
            Etl:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Etl/Entity'
                prefix: 'App\Etl\Entity'
                alias: Etl
            Enrichment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Enrichment/Entity'
                prefix: 'App\Enrichment\Entity'
                alias: Enrichment
            Ocr:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ocr/Entity'
                prefix: 'App\Ocr\Entity'
                alias: Ocr
            Vision:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Vision/Entity'
                prefix: 'App\Vision\Entity'
                alias: Vision
            Account:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Account/Entity'
                prefix: 'App\Account\Entity'
                alias: Account
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Entity'
                prefix: 'App\Shared\Entity'
                alias: Shared
            Audit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Audit/Entity'
                prefix: 'App\Audit\Entity'
                alias: Audit
            Dashboard:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Dashboard/Entity'
                prefix: 'App\Dashboard\Entity'
                alias: Dashboard
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
